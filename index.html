<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fragments of Structure</title>
<meta name="description" content="Not mine. Not yours. Just fragments left behind.">
<style>
  /* ── 和文・英文セリフ（Google Fonts） ── */
  @import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=Noto+Serif+JP:wght@300;400&family=Zen+Kurenaido&display=swap');

  /* ── Satoshi（旧プラットフォームからセルフホスト移植） ── */
  @font-face {
    font-family: 'Satoshi';
    src: url('fonts/Satoshi-Light.woff2') format('woff2');
    font-weight: 300; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: 'Satoshi';
    src: url('fonts/Satoshi-Regular.woff2') format('woff2');
    font-weight: 400; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: 'Satoshi';
    src: url('fonts/Satoshi-Medium.woff2') format('woff2');
    font-weight: 500; font-style: normal; font-display: swap;
  }

  :root {
    --bg:      #f9f8f6;   /* 生成り（和紙） */
    --card:    rgba(255,255,255,0.8);
    --ink:     #1c1c1c;   /* 墨 */
    --muted:   #6a6a6a;   /* 薄墨 */
    --line:    rgba(58,58,58,0.10);
    --line-mid:rgba(58,58,58,0.18);
    --gold:    #d4af37;
    --gold-soft: rgba(212,175,55,0.30);
    --elegant: cubic-bezier(0.19, 1, 0.22, 1);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Satoshi', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-weight: 400;
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* ───── ヘッダー ───── */
  header {
    text-align: center;
    padding: 7rem 2rem 3.5rem;
  }

  .title {
    font-family: 'Satoshi', sans-serif;
    font-weight: 300;
    font-size: clamp(2.2rem, 6vw, 3.6rem);
    letter-spacing: 0.22em;
    text-indent: 0.22em;
    color: var(--ink);
    opacity: 0;
    animation: rise 1.4s var(--elegant) 0.15s forwards;
  }

  .subtitle {
    margin-top: 1.4rem;
    font-family: 'Noto Serif JP', serif;
    font-weight: 300;
    font-size: 0.96rem;
    letter-spacing: 0.5em;
    text-indent: 0.5em;
    color: var(--muted);
    opacity: 0;
    animation: rise 1.4s var(--elegant) 0.45s forwards;
  }

  .lead {
    margin: 2.2rem auto 0;
    max-width: 460px;
    font-family: 'Lora', serif;
    font-style: italic;
    font-size: 1.04rem;
    line-height: 1.9;
    letter-spacing: 0.02em;
    color: var(--muted);
    opacity: 0;
    animation: rise 1.4s var(--elegant) 0.8s forwards;
  }

  .rule {
    width: 1px; height: 3.2rem;
    margin: 2.6rem auto 0;
    background: linear-gradient(to bottom, var(--gold-soft), transparent);
    opacity: 0;
    animation: fade 1.6s ease 1.2s forwards;
  }

  @keyframes rise { from { opacity: 0; transform: translateY(1.4rem); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

  /* ───── グリッド ───── */
  main {
    max-width: 1180px;
    margin: 0 auto;
    padding: 2.5rem 2rem 8rem;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 320px));
    justify-content: start;
    gap: 2.4rem 2rem;
  }

  /* タイル ＝ 額装された作品 ＋ 下のキャプション */
  .tile {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 0.75rem;
    overflow: hidden;
    cursor: pointer;
    backdrop-filter: blur(4px);
    opacity: 0;
    transform: translateY(1.6rem);
    transition: opacity 0.7s var(--elegant), transform 0.7s var(--elegant), box-shadow 0.5s ease, border-color 0.5s ease;
  }
  .tile.in { opacity: 1; transform: translateY(0); }
  .tile:hover {
    transform: translateY(-4px);
    border-color: var(--line-mid);
    box-shadow: 0 20px 35px -12px rgba(0,0,0,0.16);
  }

  /* 額（作品が収まる枠） */
  .frame {
    position: relative;
    aspect-ratio: 4 / 5;
    margin: 0.85rem 0.85rem 0;
    border-radius: 0.4rem;
    overflow: hidden;
    box-shadow: inset 0 0 0 1px rgba(58,58,58,0.12), inset 0 2px 10px rgba(0,0,0,0.05);
    background: #f4f2ee;
  }

  .frame .still {
    position: absolute; inset: 0;
    background:
      radial-gradient(circle at 50% 40%, rgba(212,175,55,0.07), rgba(249,248,246,0) 62%),
      #f4f2ee;
    background-size: cover; background-position: center;
    transition: opacity 0.8s ease;
  }
  .tile.playing .frame .still { opacity: 0; }

  .frame .live {
    position: absolute; inset: 0;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.8s ease;
  }
  .tile.playing .frame .live { opacity: 1; }
  .frame .live iframe { width: 100%; height: 100%; border: 0; display: block; }

  /* キャプション（白地の和紙に刻む銘） */
  .caption {
    padding: 1.05rem 1.1rem 1.25rem;
  }
  .caption .meta {
    display: flex; align-items: center; gap: 0.55rem;
    font-family: 'Satoshi', sans-serif; font-weight: 400;
    font-size: 0.6rem; letter-spacing: 0.22em;
    color: var(--muted);
    margin-bottom: 0.55rem;
    text-transform: uppercase;
  }
  .caption .meta .no { color: var(--ink); letter-spacing: 0.18em; }
  .caption .meta .ver { opacity: 0.7; }
  .caption .meta .archived-tag {
    color: #a8392b; letter-spacing: 0.16em; opacity: 0.85;
  }
  .tile.archived .frame { opacity: 0.55; filter: saturate(0.8); }
  .tile.archived .frame::after {
    content: 'ARCHIVED';
    position: absolute; top: 0.8rem; left: 0.8rem; z-index: 4;
    font-family: 'Satoshi', sans-serif; font-weight: 500;
    font-size: 0.58rem; letter-spacing: 0.22em;
    color: #a8392b; background: rgba(249,248,246,0.85);
    padding: 0.22rem 0.55rem; border-radius: 2px;
  }
  .caption .use {
    display: inline-block;
    font-family: 'Satoshi', sans-serif; font-weight: 400;
    font-size: 0.62rem; letter-spacing: 0.18em;
    color: var(--gold);
    border: 1px solid var(--gold-soft);
    border-radius: 999px;
    padding: 0.22rem 0.62rem;
    margin-bottom: 0.7rem;
  }
  .caption .ja {
    display: block;
    font-family: 'Noto Serif JP', serif; font-weight: 400;
    font-size: 1.08rem; letter-spacing: 0.06em;
    line-height: 1.4; color: var(--ink);
  }
  .caption .en {
    display: block; margin-top: 0.35rem;
    font-family: 'Lora', serif; font-style: italic;
    font-size: 0.82rem; letter-spacing: 0.04em;
    color: var(--muted);
  }

  /* 「来たる断片」プレースホルダ */
  .tile.coming {
    background: transparent;
    border-style: dashed;
    border-color: var(--line-mid);
    backdrop-filter: none;
    display: flex; align-items: center; justify-content: center;
    min-height: 13rem;
    cursor: default;
  }
  .tile.coming:hover { transform: none; box-shadow: none; border-color: var(--line-mid); }
  .tile.coming span {
    font-family: 'Lora', serif; font-style: italic;
    font-size: 0.92rem; letter-spacing: 0.16em;
    color: rgba(106,106,106,0.6);
  }

  /* ───── プロジェクト区分 ───── */
  .project { margin-top: 4rem; }
  .project:first-of-type { margin-top: 0; }
  .project-head {
    display: flex; align-items: baseline; gap: 1.1rem;
    margin-bottom: 1.7rem;
  }
  .project-head .name {
    font-family: 'Satoshi', sans-serif; font-weight: 500;
    font-size: 1.04rem; letter-spacing: 0.14em;
    color: var(--ink); white-space: nowrap;
  }
  .project-head .count {
    font-family: 'Lora', serif; font-style: italic;
    font-size: 0.8rem; color: var(--muted); white-space: nowrap;
  }
  .project-head .bar {
    flex: 1; height: 1px;
    background: linear-gradient(to right, var(--line-mid), transparent);
  }

  /* ───── 全画面ビューア ───── */
  #viewer {
    position: fixed; inset: 0; z-index: 100;
    background: var(--bg);
    opacity: 0; pointer-events: none;
    transition: opacity 0.55s ease;
  }
  #viewer.open { opacity: 1; pointer-events: all; }
  #viewer iframe { width: 100%; height: 100%; border: 0; }
  #viewer .close {
    position: absolute; top: 1.6rem; right: 1.8rem; z-index: 101;
    width: 3rem; height: 3rem; border-radius: 50%;
    border: 1px solid var(--line-mid);
    background: rgba(255,255,255,0.7); backdrop-filter: blur(8px);
    color: var(--muted); font-size: 1.4rem; line-height: 1; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.4s ease;
  }
  #viewer .close:hover {
    color: var(--gold); border-color: var(--gold-soft);
    transform: rotate(90deg);
  }

  /* ───── フッター ───── */
  footer {
    text-align: center;
    padding: 3rem 2rem 4.5rem;
    border-top: 1px solid var(--line);
    font-family: 'Lora', serif; font-style: italic;
    font-size: 0.82rem; letter-spacing: 0.1em;
    color: rgba(106,106,106,0.7);
  }

  @media (max-width: 600px) {
    header { padding: 4.5rem 1.5rem 2.5rem; }
    main { padding: 2rem 1.2rem 5rem; }
    .grid { gap: 1.8rem 1.2rem; }
  }
</style>
</head>
<body>

<header>
  <h1 class="title">Fragments of Structure</h1>
  <p class="subtitle">構 造 の か け ら</p>
  <p class="lead">Not mine. Not yours.<br>Just fragments left behind.</p>
  <div class="rule"></div>
</header>

<main id="atelier"></main>

<footer>an evolving garden of code — grown one fragment at a time</footer>

<div id="viewer">
  <button class="close" aria-label="閉じる">×</button>
</div>

<script>
(() => {
  'use strict';

  // ====== 作品の登録 ======
  // 新作はここに1行足すだけ。file は works/ 配下の相対パス。
  // still は静止プレビュー画像（任意）。無ければ和紙の空き額のまま。
  //
  // ▼ 識別子とバージョン
  //   no       : F001〜の通し番号。一度振ったら変えない（改訂版でも継承）
  //   version  : 'v1' / 'v2' / ... 同じ作品の改訂を重ねる
  //   status   : 'current' | 'archived'
  //              旧版は消さずに残し archived にする。
  //              （手痕跡を構造として残すという指針＝subtractive-vs-overbuild）
  //
  // ▼ 改訂手順
  //   1) 既存エントリの status を 'archived' に変更
  //   2) 同じ no で新しいエントリを追加（version='v2', status='current'）
  //   3) ファイル名は `-v2` サフィックス推奨（例: sd-todays-mountain-v2.html）
  //      git 履歴で前バージョンは常に取り出せるが、並べて見たいので別ファイルで残す
  //
  // project = どのプロダクト向けの案か / use = 用途。この2軸で束ねる。
  const WORKS = [
    {
      no: 'F001', version: 'v1', status: 'current',
      project: 'STUDIES',          // 習作・どのプロダクトにも属さない単独作
      use: '鑑賞 / Standalone',
      ja: '六段階の変容',
      en: 'Six States',
      file: 'works/mandala.html',
      still: '' // 例: 'works/thumbs/mandala.png'
    },
    {
      no: 'F002', version: 'v1', status: 'current',
      project: 'STUDIES',
      use: '工房 / Studio',
      ja: '曼荼羅工房',
      en: 'Mandala Studio',
      file: 'works/sd-mandala-studio.html',
      still: ''
    },
    {
      no: 'F003', version: 'v1', status: 'current',
      project: 'SILAS',
      use: '診断の待ち時間 / Loading',
      ja: '起動の星座',
      en: 'Opening',
      file: 'works/sd-opening.html',
      still: ''
    },
    {
      no: 'F004', version: 'v1', status: 'current',
      project: 'SILAS',
      use: '瞑想の線画 / Loading',
      ja: '禅の筆',
      en: 'Zen Brush',
      file: 'works/sd-zen-lines.html',
      still: ''
    },
    {
      no: 'F005', version: 'v1', status: 'current',
      project: 'SILAS',
      use: '診断の待ち時間 / Loading',
      ja: '深い収束',
      en: 'Slow Convergence',
      file: 'works/sd-particles.html',
      still: ''
    },
    {
      no: 'F006', version: 'v1', status: 'current',
      project: 'SILAS',
      use: 'ロゴの鼓動 / Idle',
      ja: '鼓動',
      en: 'Pulse',
      file: 'works/sd-pulse.html',
      still: ''
    },
    {
      no: 'F007', version: 'v1', status: 'current',
      project: 'SILAS',
      use: '瞑想の間 / Pause',
      ja: '瞑想の鼓動',
      en: 'Meditation Pulse',
      file: 'works/sd-meditation-pulse.html',
      still: ''
    },
    {
      no: 'F008', version: 'v1', status: 'current',
      project: 'SILAS',
      use: 'オープニング / Reveal',
      ja: '広がる渦',
      en: 'Expanding',
      file: 'works/sd-expanding.html',
      still: ''
    },
    {
      no: 'F009', version: 'v1', status: 'current',
      project: 'SILAS',
      use: '診断の待ち時間 / 結果遷移',
      ja: '収束する星座',
      en: 'Quiet Convergence',
      file: 'works/sd-converge.html',
      still: ''
    },
    {
      no: 'F010', version: 'v1', status: 'current',
      project: 'SILAS',
      use: 'ジェネラティブ / Generative',
      ja: '枯山水',
      en: 'Dry Garden',
      file: 'works/sd-attractor.html',
      still: ''
    },
    {
      no: 'F011', version: 'v1', status: 'current',
      project: 'SILAS',
      use: 'ジェネラティブ / Generative',
      ja: '数式の曼荼羅',
      en: 'Mathematical Mandala',
      file: 'works/sd-parametric.html',
      still: ''
    },
    {
      no: 'F012', version: 'v1', status: 'current',
      project: 'SILAS',
      use: '型印 / Type Marks',
      ja: '12タイプ印',
      en: 'Twelve Type Marks',
      file: 'works/sd-mandala-marks.html',
      still: ''
    },
    {
      no: 'F013', version: 'v1', status: 'current',
      project: 'SILAS',
      use: 'プロファイル / Profile',
      ja: 'プロファイル試作',
      en: 'Profile (mark demo)',
      file: 'works/silas-profile-demo.html',
      still: ''
    },
    {
      no: 'F014', version: 'v1', status: 'current',
      project: 'SILAS',
      use: 'Home / Today',
      ja: '今日の山',
      en: "Today's Mountains (seeded sumi)",
      file: 'works/sd-todays-mountain.html',
      still: ''
    },
    {
      no: 'F015', version: 'v1', status: 'current',
      project: 'STUDIES',
      use: '工房 / Studio',
      ja: '非対称の印を探す',
      en: 'Asymmetric Mark Studio',
      file: 'works/sd-asym-studio.html',
      still: ''
    },
    {
      no: 'F016', version: 'v1', status: 'current',
      project: 'STUDIES',
      use: '工房 / Studio',
      ja: '比の渦',
      en: 'Ratio Spirals (gold · silver · yamato · bronze)',
      file: 'works/sd-ratio-spirals.html',
      still: ''
    },
  ];

  const atelier = document.getElementById('atelier');
  const viewer = document.getElementById('viewer');
  const closeBtn = viewer.querySelector('.close');

  // WORKS をプロジェクトごとに束ねる（出現順を保持）
  const groups = [];
  const groupIndex = new Map();
  WORKS.forEach(w => {
    if (!groupIndex.has(w.project)) {
      groupIndex.set(w.project, groups.length);
      groups.push({ project: w.project, items: [] });
    }
    groups[groupIndex.get(w.project)].items.push(w);
  });

  let order = 0; // フェードインの通し遅延

  // 画面に入ったタイルだけ自動再生し、外れたら破棄（数が増えても軽い）
  const io = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      const tile = entry.target;
      if (entry.isIntersecting) {
        if (tile._live.childElementCount === 0) {
          const f = document.createElement('iframe');
          f.setAttribute('scrolling', 'no');
          f.setAttribute('tabindex', '-1');
          f.setAttribute('loading', 'lazy');
          f.src = tile._file;
          tile._live.appendChild(f);
        }
        tile.classList.add('playing');
      } else {
        tile.classList.remove('playing');
        setTimeout(() => {
          if (!tile.classList.contains('playing')) tile._live.innerHTML = '';
        }, 600);
      }
    });
  }, { threshold: 0.2, rootMargin: '120px 0px' });

  function makeTile(w) {
    const tile = document.createElement('article');
    tile.className = 'tile' + (w.status === 'archived' ? ' archived' : '');
    tile.style.transitionDelay = (0.1 + order++ * 0.07) + 's';

    const frame = document.createElement('div');
    frame.className = 'frame';
    const still = document.createElement('div');
    still.className = 'still';
    if (w.still) still.style.backgroundImage = `url('${w.still}')`;
    const live = document.createElement('div');
    live.className = 'live';
    frame.appendChild(still);
    frame.appendChild(live);

    const caption = document.createElement('div');
    caption.className = 'caption';
    const metaLine =
      (w.no || w.version)
        ? `<div class="meta">` +
            (w.no ? `<span class="no">${w.no}</span>` : '') +
            (w.version ? `<span class="ver">${w.version}</span>` : '') +
            (w.status === 'archived' ? `<span class="archived-tag">旧版</span>` : '') +
          `</div>`
        : '';
    caption.innerHTML =
      metaLine +
      (w.use ? `<span class="use">${w.use}</span>` : '') +
      `<span class="ja">${w.ja}</span>` +
      `<span class="en">${w.en}</span>`;

    tile.appendChild(frame);
    tile.appendChild(caption);

    // ビューポートに入ったら自動再生（IntersectionObserverが制御）
    tile._live = live;
    tile._file = w.file;
    io.observe(tile);

    tile.addEventListener('click', () => openViewer(w.file));
    return tile;
  }

  function makeComing() {
    const coming = document.createElement('div');
    coming.className = 'tile coming';
    coming.innerHTML = '<span>― the next fragment ―</span>';
    coming.style.transitionDelay = (0.1 + order++ * 0.07) + 's';
    return coming;
  }

  // プロジェクトごとにセクションを組む（各庭に「次の断片」の余白つき）
  groups.forEach(g => {
    const section = document.createElement('section');
    section.className = 'project';

    const head = document.createElement('div');
    head.className = 'project-head';
    head.innerHTML =
      `<span class="name">${g.project}</span>` +
      `<span class="count">${g.items.length} ${g.items.length === 1 ? 'fragment' : 'fragments'}</span>` +
      `<span class="bar"></span>`;
    section.appendChild(head);

    const grid = document.createElement('div');
    grid.className = 'grid';
    g.items.forEach(w => grid.appendChild(makeTile(w)));
    grid.appendChild(makeComing());
    section.appendChild(grid);

    atelier.appendChild(section);
  });

  requestAnimationFrame(() => {
    document.querySelectorAll('.tile').forEach(t => t.classList.add('in'));
  });

  // ====== 全画面ビューア ======
  let viewerFrame = null;
  function openViewer(src) {
    viewerFrame = document.createElement('iframe');
    viewerFrame.src = src;
    viewer.insertBefore(viewerFrame, closeBtn);
    viewer.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeViewer() {
    viewer.classList.remove('open');
    document.body.style.overflow = '';
    setTimeout(() => {
      if (viewerFrame) { viewerFrame.remove(); viewerFrame = null; }
    }, 600);
  }
  closeBtn.addEventListener('click', closeViewer);
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && viewer.classList.contains('open')) closeViewer();
  });

})();
</script>
</body>
</html>
