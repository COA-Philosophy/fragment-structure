<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fragments of Structure</title>
<meta name="description" content="Not mine. Not yours. Just fragments left behind.">
<style>
  /* ── 和文・英文セリフ（Google Fonts） ── */
  @import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=Noto+Serif+JP:wght@300;400&family=Zen+Kurenaido&display=swap');

  /* ── Satoshi（旧プラットフォームからセルフホスト移植） ── */
  @font-face {
    font-family: 'Satoshi';
    src: url('fonts/Satoshi-Light.woff2') format('woff2');
    font-weight: 300; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: 'Satoshi';
    src: url('fonts/Satoshi-Regular.woff2') format('woff2');
    font-weight: 400; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: 'Satoshi';
    src: url('fonts/Satoshi-Medium.woff2') format('woff2');
    font-weight: 500; font-style: normal; font-display: swap;
  }

  :root {
    --bg:      #f9f8f6;   /* 生成り（和紙） */
    --card:    rgba(255,255,255,0.8);
    --ink:     #1c1c1c;   /* 墨 */
    --muted:   #6a6a6a;   /* 薄墨 */
    --line:    rgba(58,58,58,0.10);
    --line-mid:rgba(58,58,58,0.18);
    --gold:    #d4af37;
    --gold-soft: rgba(212,175,55,0.30);
    --elegant: cubic-bezier(0.19, 1, 0.22, 1);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Satoshi', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-weight: 400;
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* ───── ヘッダー ───── */
  header {
    text-align: center;
    padding: 7rem 2rem 3.5rem;
  }

  .title {
    font-family: 'Satoshi', sans-serif;
    font-weight: 300;
    font-size: clamp(2.2rem, 6vw, 3.6rem);
    letter-spacing: 0.22em;
    text-indent: 0.22em;
    color: var(--ink);
    opacity: 0;
    animation: rise 1.4s var(--elegant) 0.15s forwards;
  }

  .subtitle {
    margin-top: 1.4rem;
    font-family: 'Noto Serif JP', serif;
    font-weight: 300;
    font-size: 0.96rem;
    letter-spacing: 0.5em;
    text-indent: 0.5em;
    color: var(--muted);
    opacity: 0;
    animation: rise 1.4s var(--elegant) 0.45s forwards;
  }

  .lead {
    margin: 2.2rem auto 0;
    max-width: 460px;
    font-family: 'Lora', serif;
    font-style: italic;
    font-size: 1.04rem;
    line-height: 1.9;
    letter-spacing: 0.02em;
    color: var(--muted);
    opacity: 0;
    animation: rise 1.4s var(--elegant) 0.8s forwards;
  }

  .rule {
    width: 1px; height: 3.2rem;
    margin: 2.6rem auto 0;
    background: linear-gradient(to bottom, var(--gold-soft), transparent);
    opacity: 0;
    animation: fade 1.6s ease 1.2s forwards;
  }

  @keyframes rise { from { opacity: 0; transform: translateY(1.4rem); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

  /* ───── グリッド ───── */
  main {
    max-width: 1180px;
    margin: 0 auto;
    padding: 2.5rem 2rem 8rem;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 320px));
    justify-content: start;
    gap: 2.4rem 2rem;
  }

  /* タイル ＝ 額装された作品 ＋ 下のキャプション */
  .tile {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 0.75rem;
    overflow: hidden;
    cursor: pointer;
    backdrop-filter: blur(4px);
    opacity: 0;
    transform: translateY(1.6rem);
    transition: opacity 0.7s var(--elegant), transform 0.7s var(--elegant), box-shadow 0.5s ease, border-color 0.5s ease;
  }
  .tile.in { opacity: 1; transform: translateY(0); }
  .tile:hover {
    transform: translateY(-4px);
    border-color: var(--line-mid);
    box-shadow: 0 20px 35px -12px rgba(0,0,0,0.16);
  }

  /* 額（作品が収まる枠） */
  .frame {
    position: relative;
    aspect-ratio: 4 / 5;
    margin: 0.85rem 0.85rem 0;
    border-radius: 0.4rem;
    overflow: hidden;
    box-shadow: inset 0 0 0 1px rgba(58,58,58,0.12), inset 0 2px 10px rgba(0,0,0,0.05);
    background: #f4f2ee;
  }

  .frame .still {
    position: absolute; inset: 0;
    background:
      radial-gradient(circle at 50% 40%, rgba(212,175,55,0.07), rgba(249,248,246,0) 62%),
      #f4f2ee;
    background-size: cover; background-position: center;
    transition: opacity 0.8s ease;
  }
  .tile.playing .frame .still { opacity: 0; }

  .frame .live {
    position: absolute; inset: 0;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.8s ease;
  }
  .tile.playing .frame .live { opacity: 1; }
  .frame .live iframe { width: 100%; height: 100%; border: 0; display: block; }

  /* キャプション（白地の和紙に刻む銘） */
  .caption {
    padding: 1.05rem 1.1rem 1.25rem;
  }
  .caption .meta {
    display: flex; align-items: center; gap: 0.55rem;
    font-family: 'Satoshi', sans-serif; font-weight: 400;
    font-size: 0.6rem; letter-spacing: 0.22em;
    color: var(--muted);
    margin-bottom: 0.55rem;
    text-transform: uppercase;
  }
  .caption .meta .no { color: var(--ink); letter-spacing: 0.18em; }
  .caption .meta .ver { opacity: 0.7; }
  .caption .meta .archived-tag {
    color: #a8392b; letter-spacing: 0.16em; opacity: 0.85;
  }
  .tile.archived .frame { opacity: 0.55; filter: saturate(0.8); }
  .tile.archived .frame::after {
    content: 'ARCHIVED';
    position: absolute; top: 0.8rem; left: 0.8rem; z-index: 4;
    font-family: 'Satoshi', sans-serif; font-weight: 500;
    font-size: 0.58rem; letter-spacing: 0.22em;
    color: #a8392b; background: rgba(249,248,246,0.85);
    padding: 0.22rem 0.55rem; border-radius: 2px;
  }
  .caption .use {
    display: inline-block;
    font-family: 'Satoshi', sans-serif; font-weight: 400;
    font-size: 0.62rem; letter-spacing: 0.18em;
    color: var(--gold);
    border: 1px solid var(--gold-soft);
    border-radius: 999px;
    padding: 0.22rem 0.62rem;
    margin-bottom: 0.7rem;
  }
  .caption .ja {
    display: block;
    font-family: 'Noto Serif JP', serif; font-weight: 400;
    font-size: 1.08rem; letter-spacing: 0.06em;
    line-height: 1.4; color: var(--ink);
  }
  .caption .en {
    display: block; margin-top: 0.35rem;
    font-family: 'Lora', serif; font-style: italic;
    font-size: 0.82rem; letter-spacing: 0.04em;
    color: var(--muted);
  }

  /* 技法 ＝ 指して呼ぶための銘。用途ピル（金）とは役割を分け、墨で静かに */
  .caption .techrow {
    margin-top: 0.85rem;
    padding-top: 0.7rem;
    border-top: 1px solid var(--line);
  }
  .caption .tech-lab {
    font-family: 'Satoshi', sans-serif; font-weight: 500;
    font-size: 0.56rem; letter-spacing: 0.24em; text-transform: uppercase;
    color: var(--gold);
  }
  .caption .tech {
    display: block; margin-top: 0.28rem;
    font-family: 'Noto Serif JP', serif; font-weight: 400;
    font-size: 0.86rem; letter-spacing: 0.02em; line-height: 1.5;
    color: var(--ink);
  }
  .caption .how {
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
    margin-top: 0.4rem;
    font-family: 'Satoshi', sans-serif; font-weight: 300;
    font-size: 0.72rem; line-height: 1.65; letter-spacing: 0.01em;
    color: var(--muted);
  }

  /* 元コードの在処 ＋ 持ち出しボタン */
  .caption .src {
    display: flex; align-items: center; gap: 0.4rem;
    margin-top: 0.8rem;
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    font-size: 0.66rem; letter-spacing: 0.01em;
    color: var(--muted);
    background: rgba(58,58,58,0.045);
    border-radius: 0.35rem;
    padding: 0.4rem 0.55rem;
    overflow: hidden;
  }
  .caption .src .path { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .caption .cardacts { display: flex; gap: 0.45rem; margin-top: 0.65rem; }
  .caption .cardacts button {
    flex: 1;
    font-family: 'Satoshi', sans-serif; font-weight: 400;
    font-size: 0.62rem; letter-spacing: 0.12em;
    color: var(--ink);
    background: rgba(255,255,255,0.6);
    border: 1px solid var(--line-mid);
    border-radius: 0.4rem;
    padding: 0.45rem 0.3rem;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 0.3rem;
    transition: color 0.3s ease, border-color 0.3s ease, background 0.3s ease;
  }
  .caption .cardacts button:hover { color: var(--gold); border-color: var(--gold-soft); }
  .caption .cardacts button.done { color: var(--gold); border-color: var(--gold-soft); }

  /* ───── フィルタバー（技法で引く・名前で引く） ───── */
  .filterbar {
    position: sticky; top: 0; z-index: 20;
    margin-bottom: 3rem;
    padding: 1rem 0.2rem 1.1rem;
    background: rgba(249,248,246,0.86);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .filterbar .fsearch {
    display: flex; align-items: center; gap: 0.55rem;
    max-width: 420px;
    background: rgba(255,255,255,0.7);
    border: 1px solid var(--line-mid);
    border-radius: 0.6rem;
    padding: 0.55rem 0.85rem;
    margin-bottom: 0.95rem;
  }
  .filterbar .fsearch span { color: var(--muted); font-size: 0.9rem; line-height: 1; }
  .filterbar .fsearch input {
    flex: 1; border: 0; background: transparent; outline: none;
    font-family: 'Satoshi', sans-serif; font-size: 0.84rem; letter-spacing: 0.02em;
    color: var(--ink);
  }
  .filterbar .chips { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
  .filterbar .chip {
    font-family: 'Satoshi', sans-serif; font-weight: 400;
    font-size: 0.7rem; letter-spacing: 0.04em;
    color: var(--muted);
    background: rgba(255,255,255,0.55);
    border: 1px solid var(--line-mid);
    border-radius: 999px;
    padding: 0.34rem 0.78rem;
    cursor: pointer;
    transition: color 0.3s ease, background 0.3s ease, border-color 0.3s ease;
  }
  .filterbar .chip:hover { color: var(--ink); border-color: var(--gold-soft); }
  .filterbar .chip.on { color: var(--bg); background: var(--ink); border-color: var(--ink); }
  .filterbar .chip .c { opacity: 0.5; margin-left: 0.3em; font-size: 0.92em; }
  .filterbar .chip[data-proj] { border-style: dashed; }
  .filterbar .chip-sep { width: 1px; height: 1.1rem; background: var(--line-mid); margin: 0 0.25rem; }
  .filterbar .fcount {
    font-family: 'Lora', serif; font-style: italic;
    font-size: 0.74rem; color: var(--muted); margin-left: auto;
  }
  .tile.hidden, .project.hidden, .tile.coming.hidden { display: none; }
  .filtering .tile.coming { display: none; }

  @media (max-width: 600px) {
    .filterbar { margin-bottom: 2rem; }
    .filterbar .fsearch { max-width: none; }
  }

  /* 「来たる断片」プレースホルダ */
  .tile.coming {
    background: transparent;
    border-style: dashed;
    border-color: var(--line-mid);
    backdrop-filter: none;
    display: flex; align-items: center; justify-content: center;
    min-height: 13rem;
    cursor: default;
  }
  .tile.coming:hover { transform: none; box-shadow: none; border-color: var(--line-mid); }
  .tile.coming span {
    font-family: 'Lora', serif; font-style: italic;
    font-size: 0.92rem; letter-spacing: 0.16em;
    color: rgba(106,106,106,0.6);
  }

  /* ───── プロジェクト区分 ───── */
  .project { margin-top: 4rem; }
  .project:first-of-type { margin-top: 0; }
  .project-head {
    display: flex; align-items: baseline; gap: 1.1rem;
    margin-bottom: 1.7rem;
  }
  .project-head .name {
    font-family: 'Satoshi', sans-serif; font-weight: 500;
    font-size: 1.04rem; letter-spacing: 0.14em;
    color: var(--ink); white-space: nowrap;
  }
  .project-head .count {
    font-family: 'Lora', serif; font-style: italic;
    font-size: 0.8rem; color: var(--muted); white-space: nowrap;
  }
  .project-head .bar {
    flex: 1; height: 1px;
    background: linear-gradient(to right, var(--line-mid), transparent);
  }

  /* ───── 全画面ビューア ───── */
  #viewer {
    position: fixed; inset: 0; z-index: 100;
    background: var(--bg);
    opacity: 0; pointer-events: none;
    transition: opacity 0.55s ease;
  }
  #viewer.open { opacity: 1; pointer-events: all; }
  #viewer iframe { width: 100%; height: 100%; border: 0; }
  #viewer .close {
    position: absolute; top: 1.6rem; right: 1.8rem; z-index: 101;
    width: 3rem; height: 3rem; border-radius: 50%;
    border: 1px solid var(--line-mid);
    background: rgba(255,255,255,0.7); backdrop-filter: blur(8px);
    color: var(--muted); font-size: 1.4rem; line-height: 1; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.4s ease;
  }
  #viewer .close:hover {
    color: var(--gold); border-color: var(--gold-soft);
    transform: rotate(90deg);
  }

  /* HTMLソースをコピー */
  #viewer .copy {
    position: absolute; top: 1.6rem; right: 5.4rem; z-index: 101;
    height: 3rem; padding: 0 1.05rem; border-radius: 999px;
    border: 1px solid var(--line-mid);
    background: rgba(255,255,255,0.7); backdrop-filter: blur(8px);
    color: var(--muted);
    font-family: 'Satoshi', sans-serif; font-weight: 400;
    font-size: 0.66rem; letter-spacing: 0.18em; text-transform: uppercase;
    cursor: pointer;
    display: flex; align-items: center; gap: 0.5rem;
    transition: all 0.4s ease;
  }
  #viewer .copy:hover {
    color: var(--gold); border-color: var(--gold-soft);
  }
  #viewer .copy.done {
    color: var(--gold); border-color: var(--gold-soft);
  }
  #viewer .copy .glyph { font-size: 0.95rem; line-height: 1; }

  @media (max-width: 600px) {
    #viewer .copy .label { display: none; }
    #viewer .copy { padding: 0; width: 3rem; justify-content: center; }
  }

  /* ───── フッター ───── */
  footer {
    text-align: center;
    padding: 3rem 2rem 4.5rem;
    border-top: 1px solid var(--line);
    font-family: 'Lora', serif; font-style: italic;
    font-size: 0.82rem; letter-spacing: 0.1em;
    color: rgba(106,106,106,0.7);
  }

  @media (max-width: 600px) {
    header { padding: 4.5rem 1.5rem 2.5rem; }
    main { padding: 2rem 1.2rem 5rem; }
    .grid { gap: 1.8rem 1.2rem; }
  }
</style>
</head>
<body>

<header>
  <h1 class="title">Fragments of Structure</h1>
  <p class="subtitle">構 造 の か け ら</p>
  <p class="lead">Not mine. Not yours.<br>Just fragments left behind.</p>
  <div class="rule"></div>
</header>

<main id="atelier"><div id="filterbar" class="filterbar" hidden></div></main>

<footer>an evolving garden of code — grown one fragment at a time</footer>

<div id="viewer">
  <button class="copy" aria-label="HTMLをコピー" title="このHTMLをコピー">
    <span class="glyph">⧉</span><span class="label">HTML</span>
  </button>
  <button class="close" aria-label="閉じる">×</button>
</div>

    'works/almana-convergence-lp-v2.html': { family: '3D多面体', tech: '双三角錐の六面収束結晶（面=観測レンズ）', how: '5頂点6面の双三角錐を各面乱数シードで飛散させ、イージングで定位置へ収束。3D回転＋透視投影＋前後カリングで結晶化' },
    'works/almana-lp-continuity.html': { family: 'レイアウト研究', tech: '3画面フォン配置スタディ（row/fan/stagger/遠近）', how: '同一3画面(対話/記録/パターン)を?heroでクロップした端末窓で、平置き・扇・段違い・CSS perspectiveの4配置を並べ比較' },
    'works/almana-hero-karesansui-v2.html': { family: '枯山水・線画', tech: '枯山水フローフィールド砂紋（石を回避）', how: 'Perlinで歪めた流向場を中点法で積分した流線を、ブルーノイズ配点から引き、石の周りで場を曲げて砂紋を描く' },
    'works/strata.html': { family: '地層標本', tech: '墨ノイズ稜線の前後遮蔽積層', how: 'Perlin稜線を背面から手前へ和紙で遮蔽しつつ積層、各層を点描と擦れで墨化、粒子は稜線で消える' },
    'works/almana-lp-ending.html': { family: '枯山水・線画', tech: '枯山水砂紋に3画面を重ねるLP終景', how: '石を文字裏に寄せた枯山水フローフィールド背景に、対話→記録→パターンのperspective3画面をJSで右の空きに最大化して重ねる' },
    'works/almana-lp-ending-strata.html': { family: '地層標本', tech: 'ノイズ地層に3画面を重ねるLP終景', how: 'Perlinノイズ駆動の地層稜線を奥→手前へrake(点描＋かすれ)で重ね、対話→記録→パターンの3画面をperspectiveで右に重畳' },
    'works/almana-lp-connectors.html': { family: 'レイアウト研究', tech: '認識→締めの中央タイポ・セクション', how: '観察3行を中央セリフで沈める認識面＋創発型着地『跡は模様になる』と単一CVの締め面を、IntersectionObserverの段階フェードで構成' },
    'works/almana-lp-throughline.html': { family: 'レイアウト研究', tech: '6ビートを縦積みiframeで通し再生', how: '登録済み6面を100vh(連結は54vh間奏)のiframeで順に縦積みし、ドットナビ＋IO現在地表示で一本のLP体験として通す（プレビュー用）' },
    'works/almana-lp-f046.html': { family: 'レイアウト研究', tech: '6ビートを1 HTML に編集統合', how: 'Hero attractor・認識・結果カード・六観結晶・枯山水継続・締めを blanc DS で1ファイルに統合。各章のアート技法は維持し、ロゴ/FIG/余白/CTAのみ編集' },
    'works/almana-lp-f047.html': { family: 'レイアウト研究', tech: '6ビート統合LP（blanc DS・完成版）', how: 'F046統合版を編集仕上げ。六観readblock連動・正式端末モック・SP横スワイプ継続・認識圧縮・CTA強化。生構造6体系（算命学〜西洋占術）で横断読解' },
    'works/silas-blanc-home.html': { family: 'ALMANA', tech: '種つき1D Perlinの水墨稜線', how: '文字列をseedにmulberry32+1D Perlin fbmで稜線を生成、奥→手前5層、前景はfeTurbulenceでかすれ' },
    'works/silas-blanc-relationships.html': { family: 'ALMANA', tech: '相性リズムの記号マトリクス', how: '人物カードに2行×7日のgrid、◎○△×をフォントサイズ階調で強弱、当日列を朱washで強調' },
    'works/silas-blanc-relationship-detail.html': { family: 'ALMANA', tech: '二者の墨暈ベン重なり図', how: '2つのradialGradient楕円をfeGaussianBlurで暈し左右に重ね、接合部に朱点で重なりを示す' },
    'works/silas-blanc-person-detail.html': { family: 'ALMANA', tech: '人物フル鑑定の縦組み＋墨グリフ', how: '強み/注意の2分割罫、エネルギー3要素をradialGradient/螺旋pathの小墨グリフで象徴し朱点を一点' },
    'works/silas-blanc-log-progress.html': { family: 'ALMANA', tech: 'ゴール錨つき進捗の節目リスト', how: '向かう先を朱の縦罫で錨に固定、NOW/Milestones/Friction/Nextの定型節、達成は塗り円で示す' },
    'works/silas-blanc-log-input.html': { family: 'ALMANA', tech: '一タップ完結→展開の記録フォーム', how: '2×2方向選択+記録ボタンで最小完結、詳しく記録で睡眠/日光/運動/一言を段階展開' },
    'works/almana-card-maker.html': { family: 'レイアウト研究', tech: '文字数連動・余白中央の引用カード組版', how: '文字数しきい値(32/55/90)でフォント倍率を切替、blanc地+内枠罫+朱点+ALMANA銘を中央配置し5判型に焼く' },
    'works/almana-mon-card-studio.html': { family: 'アトラクタ', tech: '紋（密度現像）＋言葉の二段カード組版', how: 'de Jong等の紋を上段に密度現像し、下段に文字数連動の一行、最下部にALMANA銘。紙/墨の二面で焼く' },
    'works/almana-daily.html': { family: 'レイアウト研究', tech: '曜日駆動の投稿キット＋カードclient生成', how: '曜日(JST)→テーマで文面を決定的に提示し、ストラクチャーカードをcanvasでclient生成→保存。server不要' },
    'works/almana-3d-mon-studio.html': { family: 'アトラクタ', tech: '正典12タイプの3Dレリーフ紋章・10秒動画', how: '正典2D de Jongをz=密度起伏で3Dレリーフ化、累積生成→フェード→文→ALMANAの10秒をThree.jsで描きWebM録画' },
    'works/ink_moss_mineral_karesansui_ripple_v2.html': { family: '枯山水・線画', tech: 'インク滴と砂紋の同心波紋', how: '波源から半径拡大する同心リングを sin(a×4) でゆらぎ、楕円stretchとzone偏向で砂紋化しmultiply合成' },
  };
  WORKS.forEach(w => { const t = TECH[w.file]; if (t) { w.family = t.family; w.tech = t.tech; w.how = t.how; } });

  // このリポの実体の在処。別プロジェクトから作品を指す時は相対パスでは辿れないので、
  // `パス` コピーと .path ホバーはフルパスを渡す。移設したらここだけ直す。
  const REPO_ABS = 'C:\\Development\\fragment-structure';
  const absPath = rel => REPO_ABS + '\\' + String(rel).replace(/\//g, '\\');

  const atelier = document.getElementById('atelier');
  const viewer = document.getElementById('viewer');
  const closeBtn = viewer.querySelector('.close');
  const copyBtn = viewer.querySelector('.copy');

  // WORKS をプロジェクトごとに束ねる（出現順を保持）
  const groups = [];
  const groupIndex = new Map();
  WORKS.forEach(w => {
    if (!groupIndex.has(w.project)) {
      groupIndex.set(w.project, groups.length);
      groups.push({ project: w.project, items: [] });
    }
    groups[groupIndex.get(w.project)].items.push(w);
  });

  let order = 0; // フェードインの通し遅延

  // 画面に入ったタイルだけ自動再生し、外れたら破棄（数が増えても軽い）
  const io = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      const tile = entry.target;
      if (entry.isIntersecting) {
        if (tile._live.childElementCount === 0) {
          const f = document.createElement('iframe');
          f.setAttribute('scrolling', 'no');
          f.setAttribute('tabindex', '-1');
          f.setAttribute('loading', 'lazy');
          f.src = tile._file;
          tile._live.appendChild(f);
        }
        tile.classList.add('playing');
      } else {
        tile.classList.remove('playing');
        setTimeout(() => {
          if (!tile.classList.contains('playing')) tile._live.innerHTML = '';
        }, 600);
      }
    });
  }, { threshold: 0.2, rootMargin: '120px 0px' });

  function makeTile(w) {
    const tile = document.createElement('article');
    tile.className = 'tile' + (w.status === 'archived' ? ' archived' : '');
    tile.style.transitionDelay = (0.1 + order++ * 0.07) + 's';

    const frame = document.createElement('div');
    frame.className = 'frame';
    const still = document.createElement('div');
    still.className = 'still';
    if (w.still) still.style.backgroundImage = `url('${w.still}')`;
    const live = document.createElement('div');
    live.className = 'live';
    frame.appendChild(still);
    frame.appendChild(live);

    const caption = document.createElement('div');
    caption.className = 'caption';
    const metaLine =
      (w.no || w.version)
        ? `<div class="meta">` +
            (w.no ? `<span class="no">${w.no}</span>` : '') +
            (w.version ? `<span class="ver">${w.version}</span>` : '') +
            (w.status === 'archived' ? `<span class="archived-tag">旧版</span>` : '') +
          `</div>`
        : '';
    caption.innerHTML =
      metaLine +
      (w.use ? `<span class="use">${w.use}</span>` : '') +
      `<span class="ja">${w.ja}</span>` +
      `<span class="en">${w.en}</span>` +
      (w.tech
        ? `<div class="techrow"><span class="tech-lab">技法</span>` +
            `<span class="tech">${w.tech}</span>` +
            (w.how ? `<span class="how">${w.how}</span>` : '') +
          `</div>`
        : '') +
      `<div class="src"><span style="opacity:.55">▸</span>` +
        `<span class="path" title="${absPath(w.file)}">${w.file}</span></div>` +
      `<div class="cardacts">` +
        `<button type="button" class="copy-html"><span class="g">⧉</span><span class="t">HTML</span></button>` +
        `<button type="button" class="copy-path"><span class="g">⌁</span><span class="t">パス</span></button>` +
      `</div>`;

    tile.appendChild(frame);
    tile.appendChild(caption);

    // カード上で完結するコピー（タイルクリック＝拡大表示へ伝播させない）
    const cHtml = caption.querySelector('.copy-html');
    const cPath = caption.querySelector('.copy-path');
    cHtml.addEventListener('click', (e) => { e.stopPropagation(); cardCopyHtml(w.file, cHtml); });
    cPath.addEventListener('click', (e) => { e.stopPropagation(); cardCopyText(absPath(w.file), cPath); });

    // 検索用の素引き文字列（No・名前・技法・作り方・用途・パスを連結）
    tile._hay = [w.no, w.version, w.ja, w.en, w.tech, w.how, w.use, w.project, w.file]
      .filter(Boolean).join(' ').toLowerCase();
    tile._family = w.family || '';
    tile._project = w.project || '';

    // ビューポートに入ったら自動再生（IntersectionObserverが制御）
    tile._live = live;
    tile._file = w.file;
    io.observe(tile);

    tile.addEventListener('click', () => openViewer(w.file));
    return tile;
  }

  function makeComing() {
    const coming = document.createElement('div');
    coming.className = 'tile coming';
    coming.innerHTML = '<span>― the next fragment ―</span>';
    coming.style.transitionDelay = (0.1 + order++ * 0.07) + 's';
    return coming;
  }

  // プロジェクトごとにセクションを組む（各庭に「次の断片」の余白つき）
  groups.forEach(g => {
    const section = document.createElement('section');
    section.className = 'project';

    const head = document.createElement('div');
    head.className = 'project-head';
    head.innerHTML =
      `<span class="name">${g.project}</span>` +
      `<span class="count">${g.items.length} ${g.items.length === 1 ? 'fragment' : 'fragments'}</span>` +
      `<span class="bar"></span>`;
    section.appendChild(head);

    const grid = document.createElement('div');
    grid.className = 'grid';
    g.items.forEach(w => grid.appendChild(makeTile(w)));
    grid.appendChild(makeComing());
    section.appendChild(grid);

    atelier.appendChild(section);
  });

  // ====== フィルタバー（技法で引く・名前で引く・プロジェクトで束ねる） ======
  buildFilter();

  function buildFilter() {
    const fb = document.getElementById('filterbar');
    if (!fb) return;
    // 技法ファミリーを出現順で集計（データが増えればチップも自動で増える）
    const famOrder = [], famCount = {};
    WORKS.forEach(w => {
      const f = w.family; if (!f) return;
      if (!(f in famCount)) { famCount[f] = 0; famOrder.push(f); }
      famCount[f]++;
    });
    let html =
      '<div class="fsearch"><span>⌕</span>' +
      '<input type="search" id="fq" placeholder="技法・作品名・No で検索…" autocomplete="off" aria-label="検索"></div>' +
      '<div class="chips">' +
      '<button class="chip on" data-all="1">すべて</button>';
    famOrder.forEach(f => {
      html += `<button class="chip" data-fam="${f}">${f}<span class="c">${famCount[f]}</span></button>`;
    });
    html += '<span class="chip-sep"></span>';
    groups.forEach(g => {
      html += `<button class="chip" data-proj="${g.project}">${g.project}<span class="c">${g.items.length}</span></button>`;
    });
    html += '<span class="fcount" id="fcount"></span></div>';
    fb.innerHTML = html;
    fb.removeAttribute('hidden');

    let actFam = '', actProj = '', q = '';
    const chipEls = Array.prototype.slice.call(fb.querySelectorAll('.chip'));
    function syncChips() {
      chipEls.forEach(c => {
        if (c.dataset.all !== undefined) c.classList.toggle('on', !actFam && !actProj);
        else if (c.dataset.fam !== undefined) c.classList.toggle('on', !!actFam && c.dataset.fam === actFam);
        else if (c.dataset.proj !== undefined) c.classList.toggle('on', !!actProj && c.dataset.proj === actProj);
      });
    }
    function apply() {
      const tiles = Array.prototype.slice.call(document.querySelectorAll('.tile:not(.coming)'));
      tiles.forEach(t => {
        const ok =
          (!actFam || t._family === actFam) &&
          (!actProj || t._project === actProj) &&
          (!q || (t._hay || '').indexOf(q) > -1);
        t.classList.toggle('hidden', !ok);
      });
      document.querySelectorAll('.project').forEach(sec => {
        const vis = sec.querySelectorAll('.tile:not(.coming):not(.hidden)').length;
        sec.classList.toggle('hidden', vis === 0);
      });
      const filtering = !!(actFam || actProj || q);
      atelier.classList.toggle('filtering', filtering);
      const shown = tiles.filter(t => !t.classList.contains('hidden')).length;
      const fc = document.getElementById('fcount');
      if (fc) fc.textContent = filtering ? `${shown} / ${tiles.length}` : `${tiles.length} fragments`;
    }
    fb.addEventListener('click', e => {
      const chip = e.target.closest('.chip'); if (!chip) return;
      if (chip.dataset.all !== undefined) { actFam = ''; actProj = ''; }
      else if (chip.dataset.fam !== undefined) actFam = (actFam === chip.dataset.fam ? '' : chip.dataset.fam);
      else if (chip.dataset.proj !== undefined) actProj = (actProj === chip.dataset.proj ? '' : chip.dataset.proj);
      syncChips(); apply();
    });
    const qinput = fb.querySelector('#fq');
    qinput_listen(qinput, v => { q = v.trim().toLowerCase(); apply(); });
    apply();
  }
  function qinput_listen(el, cb) { if (el) el.addEventListener('input', () => cb(el.value)); }

  // ====== カード上で完結するコピー（HTMLソース / 相対パス） ======
  function flashBtn(btn, ok) {
    const g = btn.querySelector('.g'), t = btn.querySelector('.t');
    const baseGlyph = btn.classList.contains('copy-html') ? '⧉' : '⌁';
    const baseLabel = btn.classList.contains('copy-html') ? 'HTML' : 'パス';
    btn.classList.add('done');
    if (g) g.textContent = ok ? '✓' : '×';
    if (t) t.textContent = ok ? 'コピー済' : '失敗';
    setTimeout(() => {
      btn.classList.remove('done');
      if (g) g.textContent = baseGlyph;
      if (t) t.textContent = baseLabel;
    }, 1600);
  }
  async function cardCopyText(text, btn) {
    let ok = false;
    try {
      if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); ok = true; }
      else ok = legacyCopy(text);
    } catch (e) { ok = legacyCopy(text); }
    flashBtn(btn, ok);
  }
  async function cardCopyHtml(file, btn) {
    let html;
    try { const res = await fetch(file); if (!res.ok) throw new Error(res.status); html = await res.text(); }
    catch (e) { flashBtn(btn, false); return; }
    cardCopyText(html, btn);
  }

  requestAnimationFrame(() => {
    document.querySelectorAll('.tile').forEach(t => t.classList.add('in'));
  });

  // ====== 全画面ビューア ======
  let viewerFrame = null;
  let currentFile = null;
  function openViewer(src) {
    currentFile = src;
    resetCopyBtn();
    viewerFrame = document.createElement('iframe');
    viewerFrame.src = src;
    viewer.insertBefore(viewerFrame, copyBtn);
    viewer.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeViewer() {
    viewer.classList.remove('open');
    document.body.style.overflow = '';
    setTimeout(() => {
      if (viewerFrame) { viewerFrame.remove(); viewerFrame = null; }
    }, 600);
  }
  closeBtn.addEventListener('click', closeViewer);
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && viewer.classList.contains('open')) closeViewer();
  });

  // ====== HTMLソースをコピー ======
  const copyLabel = copyBtn.querySelector('.label');
  const copyGlyph = copyBtn.querySelector('.glyph');
  let copyResetTimer = null;
  function resetCopyBtn() {
    clearTimeout(copyResetTimer);
    copyBtn.classList.remove('done');
    copyGlyph.textContent = '⧉';
    if (copyLabel) copyLabel.textContent = 'HTML';
  }
  function flashCopy(ok) {
    clearTimeout(copyResetTimer);
    copyBtn.classList.add('done');
    copyGlyph.textContent = ok ? '✓' : '×';
    if (copyLabel) copyLabel.textContent = ok ? 'コピー済' : '失敗';
    copyResetTimer = setTimeout(resetCopyBtn, 1800);
  }
  function legacyCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.top = '-9999px';
    ta.setAttribute('readonly', '');
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    ta.remove();
    return ok;
  }
  copyBtn.addEventListener('click', async () => {
    if (!currentFile) return;
    let html;
    try {
      const res = await fetch(currentFile);
      if (!res.ok) throw new Error(res.status);
      html = await res.text();
    } catch (err) {
      flashCopy(false);
      return;
    }
    // まず Clipboard API、ダメなら textarea + execCommand にフォールバック
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(html);
        flashCopy(true);
        return;
      }
    } catch (err) { /* フォールバックへ */ }
    flashCopy(legacyCopy(html));
  });

})();
</script>
</body>
</html>
