<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fragment Structure</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600&family=Cormorant:ital,wght@0,300;0,400;0,500;1,300&display=swap');

  :root {
    --sumi: #14110f;
    --sumi-soft: #1c1916;
    --gin: #d8d4cc;
    --gin-dim: #8a857c;
    --kin: #c9a24b;
    --kin-bright: #f0d896;
    --line: rgba(216,212,204,0.08);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--sumi);
    color: var(--gin);
    font-family: 'Shippori Mincho', serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* 微細な粒子の背景 */
  #grain {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    opacity: 0.5;
  }

  /* ---- ヘッダー ---- */
  header {
    position: relative;
    z-index: 2;
    padding: 7rem 2rem 4rem;
    text-align: center;
  }

  .title {
    font-family: 'Cormorant', serif;
    font-weight: 300;
    font-size: clamp(2.6rem, 7vw, 4.6rem);
    letter-spacing: 0.14em;
    color: var(--gin);
    line-height: 1.1;
    opacity: 0;
    animation: rise 1.8s cubic-bezier(0.25,0.46,0.45,0.94) 0.2s forwards;
  }
  .title .frag { color: var(--gin); }
  .title .struct {
    display: block;
    font-size: 0.4em;
    letter-spacing: 0.55em;
    color: var(--kin);
    margin-top: 0.9em;
    text-indent: 0.55em;
  }

  .subtitle {
    margin-top: 2rem;
    font-family: 'Shippori Mincho', serif;
    font-weight: 400;
    font-size: 0.92rem;
    letter-spacing: 0.35em;
    color: var(--gin-dim);
    text-indent: 0.35em;
    opacity: 0;
    animation: rise 1.8s cubic-bezier(0.25,0.46,0.45,0.94) 0.7s forwards;
  }

  .lead {
    max-width: 480px;
    margin: 1.8rem auto 0;
    font-family: 'Cormorant', serif;
    font-style: italic;
    font-size: 1.02rem;
    line-height: 1.9;
    letter-spacing: 0.04em;
    color: var(--gin-dim);
    opacity: 0;
    animation: rise 1.8s cubic-bezier(0.25,0.46,0.45,0.94) 1.1s forwards;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(1.6rem); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ---- グリッド ---- */
  main {
    position: relative;
    z-index: 2;
    max-width: 1200px;
    margin: 0 auto;
    padding: 3rem 2rem 8rem;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 1.6rem;
  }

  .tile {
    position: relative;
    aspect-ratio: 4 / 5;
    border: 1px solid var(--line);
    border-radius: 2px;
    overflow: hidden;
    cursor: pointer;
    background: #100d0b;
    opacity: 0;
    transform: translateY(2rem);
    transition: border-color 0.6s ease, transform 0.6s ease, box-shadow 0.6s ease;
  }
  .tile.in { opacity: 1; transform: translateY(0); }
  .tile:hover {
    border-color: rgba(201,162,75,0.45);
    box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 0 1px rgba(201,162,75,0.12);
  }

  /* 静止プレビュー（背景画像 or グラデの仮置き） */
  .tile .still {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    transition: opacity 0.8s ease, transform 1.2s ease;
  }
  .tile:hover .still { opacity: 0; }

  /* ライブ iframe を入れる箱 */
  .tile .live {
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity 0.8s ease;
    pointer-events: none;
    border: 0;
  }
  .tile.playing .live { opacity: 1; }
  .tile .live iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
  }

  /* タイル下部の銘 */
  .tile .label {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 1.4rem 1.3rem 1.1rem;
    background: linear-gradient(to top, rgba(16,13,11,0.92) 30%, transparent);
    z-index: 3;
    pointer-events: none;
  }
  .tile .label .ja {
    font-family: 'Shippori Mincho', serif;
    font-weight: 500;
    font-size: 1.12rem;
    letter-spacing: 0.18em;
    color: var(--gin);
  }
  .tile .label .en {
    display: block;
    margin-top: 0.35em;
    font-family: 'Cormorant', serif;
    font-style: italic;
    font-size: 0.78rem;
    letter-spacing: 0.22em;
    color: var(--kin);
    opacity: 0.75;
  }

  /* 「来たる断片」プレースホルダ */
  .tile.coming {
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: default;
    border-style: dashed;
    border-color: rgba(216,212,204,0.10);
  }
  .tile.coming:hover { border-color: rgba(216,212,204,0.10); box-shadow: none; }
  .tile.coming span {
    font-family: 'Cormorant', serif;
    font-style: italic;
    font-size: 0.92rem;
    letter-spacing: 0.2em;
    color: rgba(138,133,124,0.5);
  }

  /* ---- 全画面ビューア ---- */
  #viewer {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: var(--sumi);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.6s ease;
  }
  #viewer.open { opacity: 1; pointer-events: all; }
  #viewer iframe { width: 100%; height: 100%; border: 0; }
  #viewer .close {
    position: absolute;
    top: 1.6rem; right: 1.8rem;
    z-index: 101;
    width: 3rem; height: 3rem;
    border-radius: 50%;
    border: 1px solid rgba(216,212,204,0.2);
    background: rgba(20,17,15,0.6);
    backdrop-filter: blur(10px);
    color: var(--gin-dim);
    font-size: 1.4rem;
    line-height: 1;
    cursor: pointer;
    transition: all 0.4s ease;
    display: flex; align-items: center; justify-content: center;
  }
  #viewer .close:hover {
    color: var(--kin-bright);
    border-color: rgba(201,162,75,0.5);
    transform: rotate(90deg);
  }

  /* ---- フッター ---- */
  footer {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 3rem 2rem 4rem;
    border-top: 1px solid var(--line);
    font-family: 'Cormorant', serif;
    font-style: italic;
    font-size: 0.82rem;
    letter-spacing: 0.18em;
    color: rgba(138,133,124,0.6);
  }

  @media (max-width: 600px) {
    header { padding: 4.5rem 1.5rem 2.5rem; }
    main { padding: 2rem 1.2rem 5rem; }
    .grid { gap: 1rem; }
  }
</style>
</head>
<body>
<canvas id="grain"></canvas>

<header>
  <h1 class="title">
    <span class="frag">Fragment</span>
    <span class="struct">STRUCTURE</span>
  </h1>
  <p class="subtitle">断 片 の 構 造</p>
  <p class="lead">試行錯誤の断片が、やがて構造となる。<br>触れれば、それは動き出す。</p>
</header>

<main>
  <div class="grid" id="grid"></div>
</main>

<footer>
  Fragment Structure — an evolving garden of code
</footer>

<div id="viewer">
  <button class="close" aria-label="閉じる">×</button>
</div>

<script>
(() => {
  'use strict';

  // ====== 作品の登録 ======
  // 新作はここに1行足すだけ。file は works/ 配下の相対パス。
  // still は静止プレビュー画像（任意）。無ければ暗い下地のまま。
  const WORKS = [
    {
      ja: '六段階の変容',
      en: 'SIX STATES',
      file: 'works/mandala.html',
      still: '' // 例: 'works/thumbs/mandala.png'
    },
    // { ja: '墨絵の滲み', en: 'INK BLEED',  file: 'works/ink.html',    still: '' },
    // { ja: '一滴の波紋', en: 'RIPPLE',     file: 'works/ripple.html', still: '' },
  ];

  const grid = document.getElementById('grid');
  const viewer = document.getElementById('viewer');
  const closeBtn = viewer.querySelector('.close');

  // タイル生成
  WORKS.forEach((w, i) => {
    const tile = document.createElement('div');
    tile.className = 'tile';
    tile.style.transitionDelay = (0.1 + i * 0.08) + 's';

    const still = document.createElement('div');
    still.className = 'still';
    if (w.still) {
      still.style.backgroundImage = `url('${w.still}')`;
    } else {
      // 静止プレビューが無い場合の上品な下地
      still.style.background =
        'radial-gradient(circle at 50% 45%, rgba(201,162,75,0.10), rgba(20,17,15,0) 60%), #100d0b';
    }

    const live = document.createElement('div');
    live.className = 'live';

    const label = document.createElement('div');
    label.className = 'label';
    label.innerHTML = `<span class="ja">${w.ja}</span><span class="en">${w.en}</span>`;

    tile.appendChild(still);
    tile.appendChild(live);
    tile.appendChild(label);
    grid.appendChild(tile);

    // ホバーでライブプレビュー（iframeを生成、離れたら破棄）
    let hoverTimer = null;
    tile.addEventListener('mouseenter', () => {
      hoverTimer = setTimeout(() => {
        if (live.childElementCount === 0) {
          const f = document.createElement('iframe');
          f.setAttribute('scrolling', 'no');
          f.setAttribute('tabindex', '-1');
          f.src = w.file;
          live.appendChild(f);
        }
        tile.classList.add('playing');
      }, 120); // ちょい遅延で誤反応を防ぐ
    });
    tile.addEventListener('mouseleave', () => {
      clearTimeout(hoverTimer);
      tile.classList.remove('playing');
      // メモリ解放：iframeを破棄
      setTimeout(() => {
        if (!tile.classList.contains('playing')) live.innerHTML = '';
      }, 800);
    });

    // クリックで全画面
    tile.addEventListener('click', () => openViewer(w.file));
  });

  // 「来たる断片」プレースホルダを1つ添える（庭が育つ余白）
  const coming = document.createElement('div');
  coming.className = 'tile coming in';
  coming.innerHTML = '<span>― 次の断片 ―</span>';
  coming.style.transitionDelay = (0.1 + WORKS.length * 0.08) + 's';
  grid.appendChild(coming);

  // 出現アニメーション
  requestAnimationFrame(() => {
    document.querySelectorAll('.tile').forEach(t => t.classList.add('in'));
  });

  // ====== 全画面ビューア ======
  let viewerFrame = null;
  function openViewer(src) {
    viewerFrame = document.createElement('iframe');
    viewerFrame.src = src;
    viewer.insertBefore(viewerFrame, closeBtn);
    viewer.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeViewer() {
    viewer.classList.remove('open');
    document.body.style.overflow = '';
    setTimeout(() => {
      if (viewerFrame) { viewerFrame.remove(); viewerFrame = null; }
    }, 600);
  }
  closeBtn.addEventListener('click', closeViewer);
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && viewer.classList.contains('open')) closeViewer();
  });

  // ====== 背景の微細な粒子 ======
  const cv = document.getElementById('grain');
  const gx = cv.getContext('2d');
  let W, H, dust;
  function initGrain() {
    W = cv.width = window.innerWidth;
    H = cv.height = window.innerHeight;
    dust = Array.from({length: 50}, () => ({
      x: Math.random() * W, y: Math.random() * H,
      r: Math.random() * 1.1 + 0.2,
      vy: Math.random() * 0.12 + 0.02,
      ph: Math.random() * Math.PI * 2,
    }));
  }
  initGrain();
  window.addEventListener('resize', initGrain);
  let gt = 0;
  (function loop() {
    gt += 0.016;
    gx.clearRect(0, 0, W, H);
    for (const d of dust) {
      d.y -= d.vy;
      if (d.y < -5) d.y = H + 5;
      const tw = 0.3 + 0.5 * (Math.sin(gt * 0.5 + d.ph) * 0.5 + 0.5);
      gx.fillStyle = `rgba(216,212,204,${0.12 * tw})`;
      gx.beginPath(); gx.arc(d.x, d.y, d.r, 0, Math.PI * 2); gx.fill();
    }
    requestAnimationFrame(loop);
  })();

})();
</script>
</body>
</html>
