<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>ALMANA — Daily</title>
<!--
  毎朝これを開く → その日の文面をコピー → ストラクチャーカードを保存 → SNSに貼る。
  全部 client-side（server なし）。曜日(JST)→テーマ→文面＋カードを決定的に出す。
  編集システム: structure-designer-v3 / claudedocs/almana-weekly-editorial.md
  紋カード/動画は土曜のみ別studio（almana-mon-card-studio.html / almana-living-dejong.html）。
-->
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&family=Lora:ital@1&display=swap');
@import url('https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500&display=swap');
:root{
  --ground:#e9e8e4;--paper:#f7f7f5;--sumi:#222120;--sumi-soft:#3a3733;--sumi-mid:#6f6b64;
  --sumi-faint:#a39e95;--sumi-pale:#cbc6bc;--hair:#dedbd3;--shu:#a8392b;
  --sans:'Satoshi',ui-sans-serif,system-ui,sans-serif;--serifjp:'Noto Serif JP',serif;--serif:'Lora',Georgia,serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{background:var(--ground);color:var(--sumi);font-family:var(--sans);-webkit-font-smoothing:antialiased;
  padding:max(20px,env(safe-area-inset-top)) 18px 60px;}
.wrap{max-width:520px;margin:0 auto;}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px;}
.brand{font-family:var(--serifjp);font-weight:700;font-size:15px;letter-spacing:.34em;color:var(--sumi-soft);}
.brand .d{color:var(--shu);}
.kdate{font-family:var(--sans);font-weight:300;font-size:11px;letter-spacing:.16em;color:var(--sumi-faint);text-transform:uppercase;}
.nav{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 20px;}
.nav a{flex:1;min-width:36px;text-align:center;text-decoration:none;font-family:var(--sans);font-size:13px;
  padding:9px 0;border:1px solid var(--hair);border-radius:4px;color:var(--sumi-mid);}
.nav a.on{background:var(--sumi);color:var(--ground);border-color:var(--sumi);}
.nav a .t{display:block;font-size:8px;letter-spacing:.1em;color:var(--shu);margin-top:1px;}
.nav a.on .t{color:var(--paper);opacity:.7;}
.head{font-family:var(--serifjp);font-weight:400;font-size:23px;letter-spacing:.02em;margin-bottom:3px;}
.purpose{font-family:var(--serif);font-style:italic;font-size:13px;color:var(--sumi-faint);margin-bottom:24px;}

.cardstage{display:flex;flex-direction:column;align-items:center;gap:13px;margin-bottom:30px;}
canvas#card{width:min(84vw,330px);height:auto;box-shadow:0 1px 10px rgba(30,28,24,.13);border-radius:3px;display:block;}
.cardctl{display:flex;gap:9px;align-items:center;}
.fmt{font-family:var(--sans);font-size:12px;letter-spacing:.08em;padding:8px 14px;border-radius:3px;cursor:pointer;
  border:1px solid var(--sumi-pale);background:transparent;color:var(--sumi-mid);}
.fmt.on{background:var(--sumi);color:var(--ground);border-color:var(--sumi);}
.save{flex:1;font-family:var(--sans);font-weight:500;font-size:13px;letter-spacing:.14em;text-transform:uppercase;
  padding:13px 16px;border:1px solid var(--shu);border-radius:4px;background:transparent;color:var(--shu);cursor:pointer;}
.save:active{background:var(--shu);color:#f4ebe1;}

.block{border-top:1px solid var(--hair);padding:22px 0;}
.plat{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;}
.plat .name{font-family:var(--sans);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--sumi-mid);}
.copy{font-family:var(--sans);font-size:12px;letter-spacing:.1em;padding:9px 18px;border-radius:3px;cursor:pointer;
  border:1px solid var(--sumi);background:transparent;color:var(--sumi);}
.copy.done{background:var(--shu);border-color:var(--shu);color:#f4ebe1;}
pre{font-family:var(--serifjp);font-weight:400;font-size:15px;line-height:1.9;color:var(--sumi);
  white-space:pre-wrap;word-break:break-word;}
.hint{font-family:var(--sans);font-size:11.5px;line-height:1.7;color:var(--shu);margin-top:9px;}
.links{display:flex;flex-direction:column;gap:9px;margin-top:12px;}
.links a{font-family:var(--sans);font-size:13px;letter-spacing:.04em;color:var(--shu);text-decoration:none;
  border:1px solid var(--hair);border-radius:4px;padding:11px 14px;}
.foot{font-family:var(--sans);font-size:10.5px;letter-spacing:.05em;color:var(--sumi-faint);line-height:1.7;
  border-top:1px solid var(--hair);padding-top:16px;margin-top:30px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">ALMANA<span class="d"> · DAILY</span></div>
    <div class="kdate" id="kdate">—</div>
  </div>
  <div class="nav" id="nav"></div>

  <div class="head" id="head">—</div>
  <div class="purpose" id="purpose">—</div>

  <div class="cardstage" id="cardstage">
    <canvas id="card" width="1080" height="1080"></canvas>
    <div class="cardctl">
      <button class="fmt on" data-fmt="square">正方</button>
      <button class="fmt" data-fmt="portrait">縦</button>
    </div>
    <button class="save" id="save">画像を保存</button>
  </div>

  <div id="blocks"></div>

  <div class="foot">
    月観察 / 火構造 / 水制作 / 木観察 / 金思想 / 土アート / 日創業者ログ。
    タグは核3つ（日は #ALMANA のみ）。文面＝内部の編集システム準拠。
  </div>
</div>

<script>
(function(){
  var $=function(s){return document.querySelector(s);};
  var CORE='#ALMANA #構造診断 #ジャーナリング';
  var TAGLINE='占うためではなく、読むために。';
  var WD_JA=['日','月','火','水','木','金','土'];
  var WD_EN=['sun','mon','tue','wed','thu','fri','sat'];
  var THEMES=[
    {th:'創業者ログ',pp:'人間味'},{th:'観察',pp:'「あ、自分かも」'},{th:'構造',pp:'ALMANAらしさ'},
    {th:'制作',pp:'Build in Public'},{th:'観察',pp:'共感'},{th:'思想',pp:'文化形成'},{th:'アート',pp:'世界観'}
  ];
  var SEEDS=[
    { // 0 日 創業者ログ
      x:'今日も、誰も見ていないかもしれない機能を直していた。\n\nでも「判定」を「観察」に書き換えるこの作業が、\nALMANA の全部だと思っている。',
      ig:'今日も、誰も見ていないかもしれない機能を直していた。\n\nでも「判定」を「観察」に書き換えるこの作業が、ALMANA の全部だと思っている。',
      coreOnly:true, card:null, hint:'作業机／手元の写真を添える（創業者ログは素顔が効く）。'
    },
    { // 1 月 観察
      x:'同じことで何度も悩むのは、\n意志が弱いからではなく、\n同じ構造にぶつかっているからかもしれない。',
      ig:'同じことで何度も悩むのは、意志が弱いからではなく、同じ構造にぶつかっているからかもしれない。\n\n「またやってしまった」を性格のせいにすると、直しようがない。でも構造として見ると、ぶつかる場所には形がある。形が見えれば、避け方も変わる。\n— '+TAGLINE,
      card:'同じことで何度も悩むのは、意志が弱いからではなく、同じ構造にぶつかっているから。'
    },
    { // 2 火 構造
      x:'人は変わる前に、\n自分を理解する必要があるのだろうか。\n\nそれとも理解は、\n行動のあとからやってくるのだろうか。',
      ig:'人は変わる前に、自分を理解する必要があるのだろうか。それとも理解は、行動のあとからやってくるのだろうか。\n\n変わるのが先か、理解が先か。ALMANA は順番を決めつけない。ただ、あなたの構造を観察する。\n— '+TAGLINE,
      card:'人は変わる前に、自分を理解する必要があるのだろうか。'
    },
    { // 3 水 制作
      x:'「あなたはこういう人です」\n\nという文章を、コードから消した。\n\nALMANA は判定ではなく、観察だから。',
      ig:'今日、コードから一文を消した話。\n\n「あなたはこういう人です」— その判定の言葉を、ALMANA は手放した。判定ではなく、観察へ。\n— '+TAGLINE,
      card:'判定ではなく、観察。', hint:'実スクショ／diff があればそれを優先（Build in Public は具体が効く）。'
    },
    { // 4 木 観察/共感
      x:'うまく言葉にできない不調を、\n「気のせい」で片付けてきた人へ。\n\nそれは性格でも甘えでもなく、\n構造かもしれない。',
      ig:'うまく言葉にできない不調を、「気のせい」で片付けてきた人へ。\n\n性格でも甘えでもなく、繰り返す場所には構造がある。\n— '+TAGLINE,
      card:'それは性格でも甘えでもなく、構造かもしれない。'
    },
    { // 5 金 思想（note着地）
      x:'占うためではなく、\n読むために。\n\nALMANA が信じているのは、\n答えより観察です。',
      ig:'占うためではなく、読むために。\n\n答えを配るのではなく、観察を差し出す。それが ALMANA の文化です。',
      card:TAGLINE, note:'今週のエッセイを note に着地（friction-first の構造のまま）。締め: '+TAGLINE
    },
    { // 6 土 アート
      x:'紋 — 軌跡の中から、輪郭が立ち上がる。',
      ig:'紋 — 軌跡の中から、輪郭が立ち上がる。\n\n決めるのではなく、現れる。点を打つほどに、模様が立ち上がる。\n— '+TAGLINE,
      card:'軌跡の中から、輪郭が立ち上がる。', art:true,
      hint:'紋カード／ループ動画は studio で（下のリンク）。'
    }
  ];

  // --- JST weekday ---
  function jstWeekday(){
    var s=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Tokyo',weekday:'short'}).format(new Date());
    return {Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6}[s];
  }
  function jstDate(){
    return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
  }
  var todayWd=jstWeekday();
  var qp=(location.search.match(/[?&]day=([a-z]+)/)||[])[1];
  var wd = qp && WD_EN.indexOf(qp)>=0 ? WD_EN.indexOf(qp) : todayWd;
  var fmt='square';

  function tagsFor(s){ return s.coreOnly ? '#ALMANA' : CORE; }
  function xBody(s){ return s.x+'\n\n'+tagsFor(s); }
  function igBody(s){ return s.ig+'\n\n'+tagsFor(s); }

  // --- structure card on canvas (client-side F054) ---
  var FMT={square:[1080,1080],portrait:[1080,1350]};
  function wrap(ctx,text,maxW){
    var lines=[],cur='',i,ch,t;
    for(i=0;i<text.length;i++){ ch=text[i]; t=cur+ch;
      if(cur && ctx.measureText(t).width>maxW){ lines.push(cur); cur=ch; } else cur=t; }
    if(cur)lines.push(cur); return lines;
  }
  function drawCard(text){
    var cv=$('#card'); var d=FMT[fmt]; cv.width=d[0]; cv.height=d[1];
    var W=d[0],H=d[1],ctx=cv.getContext('2d');
    ctx.fillStyle='#e9e8e4'; ctx.fillRect(0,0,W,H);
    ctx.strokeStyle='#dedbd3'; ctx.lineWidth=1; ctx.strokeRect(40.5,40.5,W-81,H-81);
    var t=(text||TAGLINE), len=Array.from(t).length;
    var base=54, qs=Math.round(len>90?base*0.6:len>55?base*0.78:len>32?base*0.92:base);
    ctx.textAlign='center'; ctx.textBaseline='alphabetic';
    ctx.font='400 '+qs+'px "Noto Serif JP", serif';
    if('letterSpacing' in ctx) ctx.letterSpacing=(0.04*qs).toFixed(1)+'px';
    var lines=wrap(ctx,t,W-192), lh=qs*1.72, quoteH=lines.length*lh;
    var blockH=9+46+quoteH+58+18+13+12, y=(H-blockH)/2;
    ctx.fillStyle='#a8392b'; ctx.beginPath(); ctx.arc(W/2,y+4.5,4.5,0,6.2832); ctx.fill();
    y+=9+46;
    ctx.fillStyle='#222120'; var by=y+qs, k;
    for(k=0;k<lines.length;k++){ ctx.fillText(lines[k],W/2,by); by+=lh; }
    if('letterSpacing' in ctx) ctx.letterSpacing='0px';
    y=y+quoteH+58;
    ctx.fillStyle='#3a3733'; ctx.font='700 18px "Noto Serif JP", serif';
    if('letterSpacing' in ctx) ctx.letterSpacing='10px';
    ctx.fillText('ALMANA',W/2+5,y+18);
    if('letterSpacing' in ctx) ctx.letterSpacing='0px';
    ctx.fillStyle='#8d887f'; ctx.font='400 11.5px "Noto Serif JP", serif';
    if('letterSpacing' in ctx) ctx.letterSpacing='5px';
    ctx.fillText('ALMANA.APP · TO READ, NOT TO PREDICT',W/2+2.5,y+18+13+11.5);
    if('letterSpacing' in ctx) ctx.letterSpacing='0px';
  }

  function copyBtn(text){
    var b=document.createElement('button'); b.className='copy'; b.textContent='コピー';
    b.addEventListener('click',function(){
      function ok(){ b.textContent='✓ コピーした'; b.classList.add('done'); setTimeout(function(){b.textContent='コピー';b.classList.remove('done');},1400); }
      if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(ok,ok); }
      else { var ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
        document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); ok(); }
    });
    return b;
  }

  function block(name,body,extra){
    var d=document.createElement('div'); d.className='block';
    var p=document.createElement('div'); p.className='plat';
    var nm=document.createElement('div'); nm.className='name'; nm.textContent=name; p.appendChild(nm);
    p.appendChild(copyBtn(body)); d.appendChild(p);
    var pre=document.createElement('pre'); pre.textContent=body; d.appendChild(pre);
    if(extra) extra(d);
    return d;
  }

  function render(){
    var s=SEEDS[wd], t=THEMES[wd];
    $('#kdate').textContent=jstDate()+(wd===todayWd?'':' · プレビュー');
    $('#head').textContent=WD_JA[wd]+'曜 — '+t.th;
    $('#purpose').textContent='目的: '+t.pp+(wd===todayWd?'':'（今日は'+WD_JA[todayWd]+'曜）');

    // nav
    var nav=$('#nav'); nav.innerHTML='';
    [1,2,3,4,5,6,0].forEach(function(i){
      var a=document.createElement('a'); a.href='?day='+WD_EN[i]; a.className=(i===wd?'on':'');
      a.innerHTML=WD_JA[i]+'<span class="t">'+(i===todayWd?'今日':'')+'</span>';
      nav.appendChild(a);
    });

    // card
    if(s.card===null){ $('#cardstage').style.display='none'; }
    else { $('#cardstage').style.display='flex'; drawCard(s.card); }

    // blocks
    var bl=$('#blocks'); bl.innerHTML='';
    bl.appendChild(block('X',xBody(s),s.hint?function(d){var h=document.createElement('div');h.className='hint';h.textContent='※ '+s.hint;d.appendChild(h);}:null));
    bl.appendChild(block('Instagram',igBody(s)));
    if(s.note){ bl.appendChild(block('note',s.note)); }
    if(s.art){
      var d=document.createElement('div'); d.className='block';
      var nm=document.createElement('div'); nm.className='name'; nm.style.marginBottom='10px'; nm.textContent='アート素材 — studio'; d.appendChild(nm);
      var lk=document.createElement('div'); lk.className='links';
      lk.innerHTML='<a href="almana-mon-card-studio.html">紋＋言葉カード（紙/墨）→</a>'+
                   '<a href="almana-living-dejong.html">living de Jong（ループ動画用）→</a>';
      d.appendChild(lk); bl.appendChild(d);
    }
  }

  document.querySelectorAll('.fmt').forEach(function(b){
    b.addEventListener('click',function(){
      document.querySelectorAll('.fmt').forEach(function(x){x.classList.remove('on');});
      b.classList.add('on'); fmt=b.dataset.fmt; drawCard(SEEDS[wd].card);
    });
  });
  $('#save').addEventListener('click',function(){
    $('#card').toBlob(function(blob){
      var a=document.createElement('a'); a.href=URL.createObjectURL(blob);
      a.download='almana_'+WD_EN[wd]+'_'+fmt+'.png';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){URL.revokeObjectURL(a.href);},800);
    },'image/png');
  });

  if(document.fonts&&document.fonts.ready){ document.fonts.ready.then(render); setTimeout(render,1200); }
  render();
})();
</script>
</body>
</html>
