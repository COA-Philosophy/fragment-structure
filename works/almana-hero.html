<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALMANA — HERO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ground:#e8e8e5; --paper:#f7f7f5; --ink:#222120;
    --hair:#e0ddd6; --soft:#6f6b64; --shu:#a8392b;
    --grotesque:"Archivo","Neue Haas Grotesk Display","Helvetica Neue",Helvetica,Arial,sans-serif;
    --logo:'Spectral',Georgia,serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--ground);color:var(--ink);
    font-family:var(--grotesque);-webkit-font-smoothing:antialiased;}

  .hero{position:relative;min-height:100vh;display:grid;grid-template-columns:0.95fr 1.05fr;}

  /* ---- left : copy ---- */
  .copy{display:flex;flex-direction:column;justify-content:center;
    padding:7vw 5vw;position:relative;}
  .eyebrow{font-size:10px;letter-spacing:0.34em;text-transform:uppercase;
    color:var(--soft);margin-bottom:34px;}
  /* EDIT COPY HERE ↓ */
  .wordmark{font-family:var(--logo);font-size:clamp(34px,5vw,72px);line-height:1;font-weight:400;
    letter-spacing:0.38em;text-transform:uppercase;color:var(--ink);margin:0;white-space:nowrap;}
  .wordmark::after{content:"";display:inline-block;width:0.13em;height:0.13em;border-radius:50%;
    background:var(--shu);margin-left:0.3em;vertical-align:0.1em;}
  .tagline{font-size:clamp(15px,1.5vw,19px);line-height:1.6;color:#3a352f;
    max-width:36ch;margin:30px 0 0;font-weight:400;}
  .tagline .jp{white-space:nowrap;}
  .tagline em{font-style:italic;color:var(--soft);}
  /* EDIT COPY HERE ↑ */
  .cta{margin-top:46px;display:inline-flex;align-items:center;gap:12px;
    align-self:flex-start;border:1px solid var(--ink);color:var(--ink);
    text-decoration:none;font-size:11px;letter-spacing:0.24em;text-transform:uppercase;
    padding:15px 26px;transition:background .18s,color .18s;}
  .cta:hover{background:var(--ink);color:var(--paper);}
  .cta-note{margin-top:14px;font-size:10.5px;letter-spacing:0.1em;color:var(--soft);}
  .footnote{position:absolute;left:5vw;bottom:34px;font-size:9px;letter-spacing:0.24em;
    text-transform:uppercase;color:var(--soft);}

  /* ---- right : Structure phone mock ---- */
  .stage{position:relative;overflow:visible;
    display:flex;align-items:center;justify-content:center;}
  .device{position:relative;width:320px;height:700px;overflow:hidden;flex:0 0 auto;
    background:transparent;border-radius:30px;zoom:var(--ds,0.9);
    box-shadow:0 40px 80px -38px rgba(34,33,32,0.30), 0 12px 30px -18px rgba(34,33,32,0.12);}
  .device iframe{display:block;width:360px;height:760px;border:0;background:transparent;
    margin:-22px 0 0 -20px;}

  .reg{position:absolute;width:13px;height:13px;pointer-events:none;}
  .reg::before,.reg::after{content:"";position:absolute;background:var(--hair);}
  .reg::before{width:13px;height:1px;} .reg::after{width:1px;height:13px;}
  .reg.tl{top:24px;left:24px;} .reg.tl::before{top:6px;left:0;} .reg.tl::after{left:6px;top:0;}
  .reg.brm{bottom:24px;right:24px;} .reg.brm::before{top:6px;left:0;} .reg.brm::after{left:6px;top:0;}

  .stamp{position:absolute;top:24px;right:24px;text-align:right;
    font-size:9px;letter-spacing:0.22em;text-transform:uppercase;color:var(--soft);line-height:1.7;}

  @media (max-width:860px){
    .hero{grid-template-columns:1fr;min-height:0;}
    .copy{order:1;padding:16vw 8vw 2vw;}
    .stage{order:2;height:auto;padding:6vw 0 4vw;}
    .device{--ds:0.55;}
    .stamp,.reg{display:none;}
    .footnote{order:3;position:static;left:auto;bottom:auto;margin:0;padding:6vw 8vw 12vw;}
  }
</style>
</head>
<body>
  <main class="hero">
    <section class="copy">
      <!-- ===== EDIT COPY BLOCK ===== -->
      <div class="eyebrow">Almana — Generative Self-Portrait</div>
      <h1 class="wordmark">ALMANA</h1>
      <p class="tagline"><span class="jp">わたしを紐解く、知のアルゴリズム。</span><br>
        <em>decoding the self — the algorithm of knowing.</em></p>
      <a class="cta" href="#">あなたの構造を見に行く →</a>
      <div class="cta-note">３分で完了、登録不要</div>
      <!-- ===== /EDIT COPY BLOCK ===== -->
    </section>

    <section class="stage" id="stage">
      <div class="reg tl"></div><div class="reg brm"></div>
      <div class="device"><iframe loading="lazy" scrolling="no" src="silas-blanc-profile-crystal.html?hero"></iframe></div>
      <div class="stamp">Structure<br>構造</div>
    </section>

    <div class="footnote">Almana · ver 0.1 · almana.app</div>
  </main>
</body>
</html>
