<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LIVING DE JONG — SUMI / PLATE</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
<style>
  :root{
    --paper:#F4F2EC; --ink:#1A1815;
    --hair:rgba(26,24,21,0.22);
    --grotesque:"Archivo","Neue Haas Grotesk Display","Helvetica Neue",Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);overflow:hidden;}
  canvas{display:block;}
  #ui{position:fixed;top:22px;left:22px;z-index:1000;width:228px;padding:16px 16px 14px;
    background:rgba(244,242,236,0.86);border:1px solid var(--hair);
    font-family:var(--grotesque);color:var(--ink);backdrop-filter:blur(2px);}
  #ui .title{font-size:10px;letter-spacing:0.28em;text-transform:uppercase;
    margin:0 0 14px;opacity:0.85;display:flex;justify-content:space-between;}
  #ui .row{margin:0 0 13px;}
  #ui label{display:block;font-size:9px;letter-spacing:0.22em;text-transform:uppercase;
    opacity:0.55;margin-bottom:6px;}
  #ui label .val{float:right;opacity:0.85;letter-spacing:0.1em;}
  select{width:100%;appearance:none;-webkit-appearance:none;background:transparent;border:none;
    border-bottom:1px solid var(--hair);color:var(--ink);font-family:var(--grotesque);
    font-size:11px;letter-spacing:0.16em;text-transform:uppercase;padding:3px 0;cursor:pointer;border-radius:0;}
  select:focus{outline:none;border-bottom-color:var(--ink);}
  input[type=range]{width:100%;-webkit-appearance:none;appearance:none;height:1px;
    background:var(--hair);outline:none;margin:7px 0 0;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:9px;height:9px;
    background:var(--ink);cursor:pointer;border-radius:50%;}
  input[type=range]::-moz-range-thumb{width:9px;height:9px;background:var(--ink);cursor:pointer;border:none;border-radius:50%;}
  .btns{display:flex;gap:8px;margin-top:4px;}
  button{flex:1;background:transparent;border:1px solid var(--hair);color:var(--ink);
    font-family:var(--grotesque);font-size:9px;letter-spacing:0.2em;text-transform:uppercase;
    padding:8px 0;cursor:pointer;transition:background .15s;}
  button:hover{background:rgba(26,24,21,0.06);} button:active{background:rgba(26,24,21,0.12);}
  #annot{position:fixed;bottom:22px;left:22px;z-index:1000;font-family:var(--grotesque);
    color:var(--ink);opacity:0.5;font-size:9px;letter-spacing:0.22em;text-transform:uppercase;
    line-height:1.7;pointer-events:none;}
  .reg{position:fixed;width:14px;height:14px;z-index:999;pointer-events:none;}
  .reg::before,.reg::after{content:"";position:absolute;background:var(--hair);}
  .reg.tr{top:18px;right:18px;} .reg.br{bottom:18px;right:18px;}
  .reg.tr::before,.reg.br::before{width:14px;height:1px;top:6px;left:0;}
  .reg.tr::after,.reg.br::after{width:1px;height:14px;left:6px;top:0;}
  #ov{position:fixed;inset:0;z-index:2000;display:none;align-items:center;justify-content:center;
    flex-direction:column;gap:10px;background:rgba(244,242,236,0.82);backdrop-filter:blur(3px);
    font-family:var(--grotesque);color:var(--ink);}
  #ov .big{font-size:11px;letter-spacing:0.34em;text-transform:uppercase;opacity:0.8;}
  #ov .pct{font-size:34px;letter-spacing:0.06em;font-weight:300;}
  #ov .sub{font-size:9px;letter-spacing:0.22em;text-transform:uppercase;opacity:0.5;}
</style>
</head>
<body>
  <div id="ui">
    <div class="title"><span>Living de Jong</span><span>RC—05</span></div>
    <div class="row"><label>Mode</label>
      <select id="modeSel">
        <option value="wander">漂う — Wander</option>
        <option value="anchor">繋留 — Anchored</option>
      </select></div>
    <div class="row"><label>Speed <span class="val" id="spdVal">1.00</span></label>
      <input type="range" id="spd" min="0.25" max="2.0" step="0.05" value="1"></div>
    <div class="row"><label>Flow <span class="val" id="flowVal">0.50</span></label>
      <input type="range" id="flow" min="0" max="1" step="0.02" value="0.5"></div>
    <div class="row"><label>Ink γ <span class="val" id="gammaVal">0.58</span></label>
      <input type="range" id="gamma" min="0.30" max="1.20" step="0.02" value="0.58"></div>
    <div class="btns"><button id="freeze">⏸ 静止</button><button id="png">PNG · 焼付</button></div>
  </div>
  <div id="annot"><div id="line1">DE JONG · WANDER</div><div id="line2">a — b — c — d —</div></div>
  <div class="reg tr"></div><div class="reg br"></div>
  <div id="ov"><div class="big">Firing Hi-Res Plate</div><div class="pct" id="ovp">0%</div>
    <div class="sub" id="ovs">multi-seed · 2000px</div></div>

<script>
const PAPER=[244,242,236], INK=[26,24,21];
const MARGIN=0.12;
const OMEGA=[2*Math.PI/37, 2*Math.PI/53, 2*Math.PI/43, 2*Math.PI/61];
const PHASE=[0.0, 1.3, 2.7, 0.6];
const WANDER={ center:[0,0,0,0],          amp:[2.30,2.30,2.30,2.30] };
const ANCHOR={ center:[1.4,-2.3,2.4,-2.1], amp:[0.35,0.35,0.35,0.35] };

let W,H,buf,maxHit=0,SC=1;
let clockSec=0, frozen=false, exporting=false;
let speed=1, flow=0.5, gamma=0.58, mode='wander';
let s={x:0.1,y:0.1};
let curParams=[1.4,-2.3,2.4,-2.1];
const N=90000;

function setup(){
  pixelDensity(1); createCanvas(windowWidth,windowHeight); frameRate(30);
  recalc(); buf=new Float32Array(W*H);
  for(let i=0;i<200;i++){ const nx=Math.sin(1.4*s.y)-Math.cos(-2.3*s.x); const ny=Math.sin(2.4*s.x)-Math.cos(-2.1*s.y); s.x=nx; s.y=ny; }
  bindUI();
}
function recalc(){ W=width; H=height; SC=(Math.min(W,H)*(1-2*MARGIN)/2)/2.2; }
function windowResized(){ resizeCanvas(windowWidth,windowHeight); recalc(); buf=new Float32Array(W*H); maxHit=0; }

function params(){
  const M = mode==='anchor'?ANCHOR:WANDER, out=[0,0,0,0];
  for(let i=0;i<4;i++) out[i]=M.center[i]+M.amp[i]*Math.sin(clockSec*OMEGA[i]+PHASE[i]);
  return out;
}

function render(){
  loadPixels();
  const denom=Math.log(1+maxHit)||1;
  const dR=INK[0]-PAPER[0], dG=INK[1]-PAPER[1], dB=INK[2]-PAPER[2];
  for(let i=0;i<buf.length;i++){
    const v=buf[i]; let r,g,b;
    if(v<0.5){ r=PAPER[0]; g=PAPER[1]; b=PAPER[2]; }
    else{ const t=Math.pow(Math.log(1+v)/denom,gamma); r=PAPER[0]+dR*t; g=PAPER[1]+dG*t; b=PAPER[2]+dB*t; }
    const q=i*4; pixels[q]=r; pixels[q+1]=g; pixels[q+2]=b; pixels[q+3]=255;
  }
  updatePixels();
}

function draw(){
  if(!frozen) clockSec += (deltaTime/1000)*speed;
  const p=params(); curParams=p;
  const [a,b,c,d]=p;
  const decay=0.985-flow*0.075;
  for(let i=0;i<buf.length;i++) buf[i]*=decay;
  maxHit*=decay;

  const cx=W/2, cy=H/2;
  for(let i=0;i<N;i++){
    const nx=Math.sin(a*s.y)-Math.cos(b*s.x);
    const ny=Math.sin(c*s.x)-Math.cos(d*s.y);
    s.x=nx; s.y=ny;
    const px=(cx+nx*SC)|0, py=(cy-ny*SC)|0;
    if(px>=0&&px<W&&py>=0&&py<H){ const idx=py*W+px; const val=++buf[idx]; if(val>maxHit)maxHit=val; }
  }
  render();

  document.getElementById('line1').textContent='DE JONG · '+(mode==='anchor'?'ANCHORED':'WANDER')+(frozen?' · FROZEN':'');
  const f=x=>(x>=0?' ':'−')+Math.abs(x).toFixed(2);
  document.getElementById('line2').textContent='a'+f(a)+'  b'+f(b)+'  c'+f(c)+'  d'+f(d);
}

// ---- behind-the-scenes high-res, multi-seed engraving plate ----
async function firePlate(){
  if(exporting) return; exporting=true;
  noLoop();
  const ov=document.getElementById('ov'), ovp=document.getElementById('ovp');
  ov.style.display='flex';
  const [a,b,c,d]=curParams;       // freeze the form currently on screen
  const RES=2000, m=0.10;
  const acc=new Float32Array(RES*RES);
  const half=RES*(1-2*m)/2, sc=half/2.2, cx=RES/2, cy=RES/2;
  const SEEDS=300, PER=80000;       // ≈ 24M points, evenly filled
  let maxv=0;
  for(let si=0; si<SEEDS; si++){
    let x=Math.random()*0.4-0.2, y=Math.random()*0.4-0.2;
    for(let i=0;i<40;i++){ const nx=Math.sin(a*y)-Math.cos(b*x); const ny=Math.sin(c*x)-Math.cos(d*y); x=nx; y=ny; }
    for(let i=0;i<PER;i++){
      const nx=Math.sin(a*y)-Math.cos(b*x); const ny=Math.sin(c*x)-Math.cos(d*y); x=nx; y=ny;
      const px=(cx+nx*sc)|0, py=(cy-ny*sc)|0;
      if(px>=0&&px<RES&&py>=0&&py<RES){ const idx=py*RES+px; const v=++acc[idx]; if(v>maxv)maxv=v; }
    }
    if((si&7)===0){ ovp.textContent=Math.round(si/SEEDS*100)+'%'; await new Promise(r=>setTimeout(r,0)); }
  }
  ovp.textContent='焼付';
  await new Promise(r=>setTimeout(r,0));
  const g=createGraphics(RES,RES); g.pixelDensity(1); g.loadPixels();
  const denom=Math.log(1+maxv)||1, gP=0.62;   // crisper, deeper than the live view
  const dR=INK[0]-PAPER[0], dG=INK[1]-PAPER[1], dB=INK[2]-PAPER[2];
  for(let i=0;i<acc.length;i++){
    const v=acc[i]; let r,gg,bb;
    if(v<0.5){ r=PAPER[0]; gg=PAPER[1]; bb=PAPER[2]; }
    else{ const t=Math.pow(Math.log(1+v)/denom,gP); r=PAPER[0]+dR*t; gg=PAPER[1]+dG*t; bb=PAPER[2]+dB*t; }
    const q=i*4; g.pixels[q]=r; g.pixels[q+1]=gg; g.pixels[q+2]=bb; g.pixels[q+3]=255;
  }
  g.updatePixels();
  const tag=mode==='anchor'?'anchored':'wander';
  save(g, 'dejong_plate_'+tag+'_'+RES+'.png');
  g.remove();
  ov.style.display='none'; exporting=false; loop();
}

function bindUI(){
  const $=id=>document.getElementById(id);
  $('modeSel').addEventListener('change',e=>{ mode=e.target.value; });
  $('spd').addEventListener('input',e=>{ speed=parseFloat(e.target.value); $('spdVal').textContent=speed.toFixed(2); });
  $('flow').addEventListener('input',e=>{ flow=parseFloat(e.target.value); $('flowVal').textContent=flow.toFixed(2); });
  $('gamma').addEventListener('input',e=>{ gamma=parseFloat(e.target.value); $('gammaVal').textContent=gamma.toFixed(2); });
  $('freeze').addEventListener('click',function(){ frozen=!frozen; this.textContent=frozen?'▶ 再開':'⏸ 静止'; });
  $('png').addEventListener('click',firePlate);
}
</script>
</body>
</html>
