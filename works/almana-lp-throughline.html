<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALMANA — LP through-line (通し順プレビュー)</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Shippori+Mincho:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#1f1f1d; --shu:#a8392b; --washi:#e8e8e5;
    --grot:"Archivo","Helvetica Neue",sans-serif; --mincho:"Shippori Mincho",serif; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ background:var(--washi); }
  .beat{ position:relative; width:100%; height:100vh; }
  .beat.tight{ height:54vh; }   /* typographic connectors (認識/締め) sit tighter than the full beats */
  .beat iframe{ width:100%; height:100%; border:0; display:block; background:var(--washi); }
  /* hairline seam + tiny beat tab so section boundaries read */
  .beat + .beat{ border-top:1px solid rgba(31,31,29,0.14); }
  .beat .tab{ position:absolute; top:0; left:0; z-index:3; pointer-events:none;
    font-family:var(--grot); font-weight:600; font-size:10px; letter-spacing:.22em; text-transform:uppercase;
    color:rgba(31,31,29,0.4); background:rgba(232,232,229,0.55); -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px);
    padding:7px 12px; }
  .beat .tab b{ color:var(--shu); margin-right:8px; }
  .beat .tab .jp{ font-family:var(--mincho); font-weight:500; letter-spacing:.1em; text-transform:none; margin-left:8px; color:rgba(31,31,29,0.6); }

  /* right dot-nav */
  .nav{ position:fixed; right:18px; top:50%; transform:translateY(-50%); z-index:10;
    display:flex; flex-direction:column; gap:14px; align-items:center; }
  .nav a{ position:relative; width:9px; height:9px; border-radius:50%;
    background:rgba(31,31,29,0.22); transition:background .25s, transform .25s; }
  .nav a:hover{ transform:scale(1.3); }
  .nav a.on{ background:var(--shu); }
  .nav a .lab{ position:absolute; right:20px; top:50%; transform:translateY(-50%);
    white-space:nowrap; font-family:var(--grot); font-weight:500; font-size:9px; letter-spacing:.18em; text-transform:uppercase;
    color:rgba(31,31,29,0.5); opacity:0; transition:opacity .2s; }
  .nav a:hover .lab,.nav a.on .lab{ opacity:1; }

  /* current-beat readout, bottom-right */
  .read{ position:fixed; right:18px; bottom:16px; z-index:10; text-align:right;
    font-family:var(--grot); font-weight:500; font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:rgba(31,31,29,0.4); }
  .read b{ color:var(--shu); }
  .read .jp{ font-family:var(--mincho); font-weight:500; letter-spacing:.08em; text-transform:none; color:var(--ink); font-size:13px; display:block; margin-bottom:3px; }
</style>
</head>
<body>
<main id="main"></main>

<nav class="nav" id="nav"></nav>
<div class="read" id="read"><span class="jp" id="rjp">—</span><span id="rn">01 / 06</span></div>

<script>
'use strict';
// 5番目(継続)を地層版にするなら 'almana-lp-ending-strata.html' に差し替え
const BEATS = [
  { n:'01', jp:'入口', en:'Hero',        src:'almana-hero-attractor.html' },
  { n:'02', jp:'認識', en:'Recognition', src:'almana-lp-connectors.html?s1' },
  { n:'03', jp:'結果', en:'Result card', src:'almana-lp-cards.html' },
  { n:'04', jp:'六観', en:'Six lenses',  src:'almana-convergence-lp-v2.html' },
  { n:'05', jp:'継続', en:'Continuity',  src:'almana-lp-ending.html' },
  { n:'06', jp:'締め', en:'Close',       src:'almana-lp-connectors.html?cv' },
];

const main = document.getElementById('main');
const nav  = document.getElementById('nav');
const rjp  = document.getElementById('rjp');
const rn   = document.getElementById('rn');

BEATS.forEach((b,i)=>{
  const sec = document.createElement('section');
  sec.className = 'beat' + (b.src.indexOf('connectors') > -1 ? ' tight' : ''); sec.id = 'beat-'+i;
  sec.innerHTML =
    '<div class="tab"><b>N°'+b.n+'</b>'+b.en+'<span class="jp">'+b.jp+'</span></div>'+
    '<iframe loading="'+(i<2?'eager':'lazy')+'" src="'+b.src+'"></iframe>';
  main.appendChild(sec);

  const dot = document.createElement('a');
  dot.href = '#beat-'+i; dot.dataset.i = i;
  dot.innerHTML = '<span class="lab">'+b.n+' '+b.jp+'</span>';
  dot.addEventListener('click',e=>{ e.preventDefault(); sec.scrollIntoView({behavior:'smooth'}); });
  nav.appendChild(dot);
});

const dots = [...nav.children];
function setActive(i){
  dots.forEach((d,k)=>d.classList.toggle('on', k===i));
  rjp.textContent = BEATS[i].jp + ' / ' + BEATS[i].en;
  rn.innerHTML = '<b>'+BEATS[i].n+'</b> / 06';
}
const io = new IntersectionObserver((es)=>{
  es.forEach(e=>{ if(e.isIntersecting){ setActive(+e.target.id.split('-')[1]); } });
}, { threshold:0.5 });
document.querySelectorAll('.beat').forEach(s=>io.observe(s));
setActive(0);
</script>
</body>
</html>
