<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>写しラボ — 錆書 SABIGAKI UTSUSHI LAB v0.5</title>
<style>
  :root{
    --paper:#F2EFE7; --paper2:#EBE7DB; --ink:#2B2723; --ink2:#6B6355;
    --rule:#D8D2C4; --sabi:#A6521F; --sabi2:#7E3C13;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;font-size:13px}
  .mono{font-family:ui-monospace,"Courier New",monospace;letter-spacing:.18em}
  header{border-bottom:1px solid var(--rule);padding:14px 20px 10px;display:flex;align-items:baseline;gap:18px;flex-wrap:wrap}
  header .eyebrow{color:var(--sabi);font-size:10px}
  header h1{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:26px;margin:0;font-weight:600}
  header .sub{color:var(--ink2);font-size:10px}
  #err{display:none;background:#7E1F13;color:#F2EFE7;padding:8px 20px;font-size:12px;white-space:pre-wrap}
  main{display:flex;gap:0;align-items:flex-start;flex-wrap:wrap}
  /* 検分台 */
  #stagewrap{flex:1 1 480px;min-width:340px;padding:16px 20px;border-right:1px solid var(--rule)}
  #stage{background:var(--paper2);border:1px solid var(--rule);padding:10px;display:inline-block;max-width:100%}
  #main{display:block;max-width:100%;height:auto;image-rendering:auto}
  #stage.squint #main{filter:blur(2.2px)}
  .viewbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:10px 0 4px}
  .viewbar label{cursor:pointer}
  .blendrow{display:flex;gap:10px;align-items:center;margin:6px 0}
  .blendrow input[type=range]{width:220px}
  #mini{display:flex;gap:8px;margin-top:10px}
  #mini canvas{width:106px;height:160px;filter:blur(1.1px);border:1px solid var(--rule)}
  .cap{color:var(--ink2);font-size:10px}
  #status{color:var(--sabi2);font-size:11px;min-height:16px;margin-top:8px}
  /* 調律盤 */
  #panel{flex:1 1 360px;min-width:320px;padding:16px 20px;max-width:560px}
  .hud{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
  .hud div{background:var(--paper2);border:1px solid var(--rule);padding:6px 8px}
  .hud b{display:block;font-size:15px;font-weight:600}
  .hud span{font-size:9px;color:var(--ink2)}
  .layers{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:10px;padding:8px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
  details{border-bottom:1px dotted var(--rule);padding:6px 0}
  summary{cursor:pointer;color:var(--sabi2);font-size:11px;letter-spacing:.14em;font-family:ui-monospace,monospace}
  .sl{display:grid;grid-template-columns:150px 1fr 52px;gap:8px;align-items:center;margin:5px 0}
  .sl label{font-size:11px;color:var(--ink2)}
  .sl input[type=range]{width:100%}
  .sl output{font-family:ui-monospace,monospace;font-size:11px;text-align:right}
  button{background:var(--ink);color:var(--paper);border:0;padding:8px 14px;font-family:ui-monospace,monospace;
    letter-spacing:.16em;font-size:11px;cursor:pointer;margin:8px 8px 0 0}
  button.ghost{background:transparent;color:var(--ink);border:1px solid var(--ink)}
  textarea{width:100%;height:110px;background:var(--paper2);border:1px solid var(--rule);
    font-family:ui-monospace,monospace;font-size:10px;margin-top:8px;color:var(--ink)}
  footer{padding:10px 20px;color:var(--ink2);font-size:10px;border-top:1px solid var(--rule)}
  input[type=range]{accent-color:var(--sabi)}
  input[type=checkbox],input[type=radio]{accent-color:var(--sabi)}
</style>
</head>
<body>
<div id="err"></div>
<header>
  <div>
    <div class="eyebrow mono">SPECIMEN — NO.003 / UTSUSHI LAB</div>

  </div>

<main>
  <section id="stagewrap">
    <div class="viewbar mono" id="views">

      <span class="cap mono">双子</span>
    </div>
    <div id="stage"><canvas id="main" width="426" height="640"></canvas></div>
    <div id="mini">
      <div><canvas id="miniRef" width="426" height="640"></canvas><div class="cap mono">REF 25%</div></div>
      <div><canvas id="miniTwin" width="426" height="640"></canvas><div class="cap mono">TWIN 25%</div></div>

  <section id="panel">
    <div class="hud mono" id="hud">
      <div><b id="cBloom">–</b><span>開花体</span></div>

      <button id="ledger">文法台帳を書き出し</button>

      <button id="import" class="ghost">調律JSONを読み込み</button>

    </div>
    <textarea id="json" class="mono" spellcheck="false" placeholder="調律JSON"></textarea>
  </section>
</main>
<footer class="mono">器: sabigaki_utsushi_lab v0.5 — 単一HTML・外部依存なし。参照JPEG同梱。合格 = 並置スクワント同種判定＋残差名指し＋層別変数表。</footer>

<script>
/* 錆書・写しラボ core — 抽出＋合成（DOM非依存）
   Python版 calligraphy_utsushi.py の等価移植。node/ブラウザ共用 */
(function (global) {
  "use strict";

  // ---------- PRNG ----------
  function mulberry32(seed) {
    let a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function gauss2(rand) { // Box-Muller
    let u = 0, v = 0;
    while (u === 0) u = rand();
    while (v === 0) v = rand();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  }

  // ---------- 基本演算 ----------
  const clamp = (x, a, b) => x < a ? a : (x > b ? b : x);
  const sstep = (x, a, b) => { const t = clamp((x - a) / (b - a + 1e-9), 0, 1); return t * t * (3 - 2 * t); };

  function gaussKernel(sigma) {
    const r = Math.max(1, Math.ceil(sigma * 3));
    const k = new Float32Array(2 * r + 1);
    let s = 0;
    for (let i = -r; i <= r; i++) { const v = Math.exp(-(i * i) / (2 * sigma * sigma)); k[i + r] = v; s += v; }
    for (let i = 0; i < k.length; i++) k[i] /= s;
    return { k, r };
  }
  const _kcache = new Map();
  function blur(src, W, H, sigma, out) {
    if (sigma <= 0.01) { (out || (out = new Float32Array(src.length))).set(src); return out; }
    const key = sigma.toFixed(3);
    let kk = _kcache.get(key); if (!kk) { kk = gaussKernel(sigma); _kcache.set(key, kk); }
    const { k, r } = kk;
    const tmp = new Float32Array(W * H);
    out = out || new Float32Array(W * H);
    for (let y = 0; y < H; y++) {           // 横
      const row = y * W;
      for (let x = 0; x < W; x++) {
        let s = 0;
        for (let i = -r; i <= r; i++) {
          let xx = x + i; if (xx < 0) xx = 0; else if (xx >= W) xx = W - 1;
          s += src[row + xx] * k[i + r];
        }
        tmp[row + x] = s;
      }
    }
    for (let x = 0; x < W; x++) {           // 縦
      for (let y = 0; y < H; y++) {
        let s = 0;
        for (let i = -r; i <= r; i++) {
          let yy = y + i; if (yy < 0) yy = 0; else if (yy >= H) yy = H - 1;
          s += tmp[yy * W + x] * k[i + r];
        }
        out[y * W + x] = s;
      }
    }
    return out;
  }

  // 円盤フットプリントの min/max（グレースケール形態学）
  function diskOffsets(r) {
    const o = [];
    for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++)
      if (dx * dx + dy * dy <= r * r) o.push([dy, dx]);
    return o;
  }
  function morphDisk(src, W, H, r, isMax) {
    const off = diskOffsets(r);
    const out = new Float32Array(W * H);
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      let v = isMax ? -1e30 : 1e30;
      for (let i = 0; i < off.length; i++) {
        let yy = y + off[i][0]; if (yy < 0) yy = 0; else if (yy >= H) yy = H - 1;
        let xx = x + off[i][1]; if (xx < 0) xx = 0; else if (xx >= W) xx = W - 1;
        const s = src[yy * W + xx];
        if (isMax ? s > v : s < v) v = s;
      }
      out[y * W + x] = v;
    }
    return out;
  }
  const grayClose = (s, W, H, r) => morphDisk(morphDisk(s, W, H, r, true), W, H, r, false);
  const grayOpen  = (s, W, H, r) => morphDisk(morphDisk(s, W, H, r, false), W, H, r, true);
  function binMorph(mask, W, H, r, isMax) {
    const f = Float32Array.from(mask);
    const m = morphDisk(f, W, H, r, isMax);
    const out = new Uint8Array(W * H);
    for (let i = 0; i < out.length; i++) out[i] = m[i] > 0.5 ? 1 : 0;
    return out;
  }

  // 連結成分（8近傍）
  function labelCC(mask, W, H) {
    const lab = new Int32Array(W * H);
    const areas = [0];
    const stack = new Int32Array(W * H);
    let next = 1;
    for (let i = 0; i < W * H; i++) {
      if (!mask[i] || lab[i]) continue;
      let sp = 0; stack[sp++] = i; lab[i] = next; let area = 0;
      while (sp) {
        const p = stack[--sp]; area++;
        const y = (p / W) | 0, x = p - y * W;
        for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
          if (!dy && !dx) continue;
          const yy = y + dy, xx = x + dx;
          if (yy < 0 || yy >= H || xx < 0 || xx >= W) continue;
          const q = yy * W + xx;
          if (mask[q] && !lab[q]) { lab[q] = next; stack[sp++] = q; }
        }
      }
      areas.push(area); next++;
    }
    return { lab, areas, n: next - 1 };
  }
  function removeSmall(mask, W, H, minArea) {
    const { lab, areas } = labelCC(mask, W, H);
    const out = new Uint8Array(W * H);
    for (let i = 0; i < out.length; i++) out[i] = (lab[i] && areas[lab[i]] >= minArea) ? 1 : 0;
    return out;
  }
  function fillSmallHoles(mask, W, H, maxArea) { // 境界に接しない背景成分 area<maxArea を埋める
    const inv = new Uint8Array(W * H);
    for (let i = 0; i < inv.length; i++) inv[i] = mask[i] ? 0 : 1;
    const { lab, areas, n } = labelCC(inv, W, H);
    const touch = new Uint8Array(n + 1);
    for (let x = 0; x < W; x++) { if (lab[x]) touch[lab[x]] = 1; const b = (H - 1) * W + x; if (lab[b]) touch[lab[b]] = 1; }
    for (let y = 0; y < H; y++) { const l = lab[y * W]; if (l) touch[l] = 1; const r2 = lab[y * W + W - 1]; if (r2) touch[r2] = 1; }
    const out = Uint8Array.from(mask);
    for (let i = 0; i < out.length; i++) {
      const l = lab[i];
      if (l && !touch[l] && areas[l] < maxArea) out[i] = 1;
    }
    return out;
  }

  // 距離変換（Felzenszwalb）: setMask=1 の最近画素までの距離
  function distToSet(setMask, W, H) {
    const INF = 1e12;
    const f = new Float32Array(W * H);
    for (let i = 0; i < f.length; i++) f[i] = setMask[i] ? 0 : INF;
    const d = new Float32Array(Math.max(W, H));
    const v = new Int32Array(Math.max(W, H));
    const z = new Float32Array(Math.max(W, H) + 1);
    const g = new Float32Array(Math.max(W, H));
    function edt1d(n, get, set) {
      let k = 0; v[0] = 0; z[0] = -INF; z[1] = INF;
      for (let q = 1; q < n; q++) {
        let s = ((get(q) + q * q) - (get(v[k]) + v[k] * v[k])) / (2 * q - 2 * v[k]);
        while (s <= z[k]) {
          k--;
          s = ((get(q) + q * q) - (get(v[k]) + v[k] * v[k])) / (2 * q - 2 * v[k]);
        }
        k++; v[k] = q; z[k] = s; z[k + 1] = INF;
      }
      k = 0;
      for (let q = 0; q < n; q++) {
        while (z[k + 1] < q) k++;
        const p = v[k];
        set(q, (q - p) * (q - p) + get(p));
      }
    }
    for (let x = 0; x < W; x++) {   // 縦
      for (let y = 0; y < H; y++) g[y] = f[y * W + x];
      edt1d(H, (i) => g[i], (i, val) => { d[i] = val; });
      for (let y = 0; y < H; y++) f[y * W + x] = d[y];
    }
    for (let y = 0; y < H; y++) {   // 横
      for (let x = 0; x < W; x++) g[x] = f[y * W + x];
      edt1d(W, (i) => g[i], (i, val) => { d[i] = val; });
      for (let x = 0; x < W; x++) f[y * W + x] = Math.sqrt(d[x]);
    }
    return f;
  }

  function maxFilterSq(src, W, H, r) { // 正方 max（分離）
    const tmp = new Float32Array(W * H), out = new Float32Array(W * H);
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      let m = -1e30;
      for (let i = -r; i <= r; i++) { let xx = clamp(x + i, 0, W - 1); const s = src[y * W + xx]; if (s > m) m = s; }
      tmp[y * W + x] = m;
    }
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      let m = -1e30;
      for (let i = -r; i <= r; i++) { let yy = clamp(y + i, 0, H - 1); const s = tmp[yy * W + x]; if (s > m) m = s; }
      out[y * W + x] = m;
    }
    return out;
  }

  function fbm(W, H, scales, weights, seed) {
    const rand = mulberry32(seed);
    const out = new Float32Array(W * H);
    const n = new Float32Array(W * H);
    for (let s = 0; s < scales.length; s++) {
      for (let i = 0; i < n.length; i++) n[i] = gauss2(rand);
      const b = blur(n, W, H, scales[s]);
      let mx = 1e-9; for (let i = 0; i < b.length; i++) { const a = Math.abs(b[i]); if (a > mx) mx = a; }
      for (let i = 0; i < out.length; i++) out[i] += weights[s] * b[i] / mx;
    }
    let mx = 1e-9; for (let i = 0; i < out.length; i++) { const a = Math.abs(out[i]); if (a > mx) mx = a; }
    for (let i = 0; i < out.length; i++) out[i] /= mx;
    return out;
  }

  function median(arr) {
    if (!arr.length) return null;
    const a = Float32Array.from(arr).sort();
    return a[a.length >> 1];
  }
  function smoothRows(buf, H, sigma) { // (H×3) の行方向1Dガウス平滑
    const { k, r } = gaussKernel(sigma);
    const sm = new Float32Array(H * 3);
    for (let c = 0; c < 3; c++) for (let y = 0; y < H; y++) {
      let s = 0;
      for (let i = -r; i <= r; i++) {
        let yy = y + i; if (yy < 0) yy = 0; else if (yy >= H) yy = H - 1;
        s += buf[yy * 3 + c] * k[i + r];
      }
      sm[y * 3 + c] = s;
    }
    buf.set(sm);
  }
  function blurAniso(src, W, H, sx, sy) { // 横σx→縦σy の分離ガウス（筋=縦伸長）
    const kx = gaussKernel(Math.max(sx, 0.05)), ky = gaussKernel(Math.max(sy, 0.05));
    const tmp = new Float32Array(W * H), out = new Float32Array(W * H);
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      let s = 0;
      for (let i = -kx.r; i <= kx.r; i++) { let xx = clamp(x + i, 0, W - 1); s += src[y * W + xx] * kx.k[i + kx.r]; }
      tmp[y * W + x] = s;
    }
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      let s = 0;
      for (let i = -ky.r; i <= ky.r; i++) { let yy = clamp(y + i, 0, H - 1); s += tmp[yy * W + x] * ky.k[i + ky.r]; }
      out[y * W + x] = s;
    }
    return out;
  }
  function pct(sorted, p) { // 昇順配列のパーセンタイル
    if (!sorted.length) return null;
    const i = clamp(Math.round((sorted.length - 1) * p), 0, sorted.length - 1);
    return sorted[i];
  }

  // ---------- 既定調律値 ----------
  const DEFAULTS = {
    // 抽出
    rust_warm_th: 0.125, rust_rg_th: 0.045, rim_warm_th: 0.30, rim_val_th: 0.34,
    crack_mag_th: 0.038, speckle_th: 0.055, hole_max: 70,
    // L2
    resid_w: 0.80, fbm_amp: 0.016, calib_mean: 1.0, calib_sd: 0.35,
    // L2.5 ペンキ膜
    paint_clean_r: 7, paint_clean: 0.55, paint_sheen: 0.12,
    // L3
    dot_gain: 0.55, dot_rad_scale: 0.85, dot_shadow_fr: 0.30,
    micro_gain: 0.35, dot_big_area: 3, dot_low_cut: 0.35,
    // L4
    crack_strength: 0.98, crack_widen: 0.7, crack_low_bst: 0.30,
    stain_gain: 1.15, stain_lambda: 55, stain_band_c: 0.46, stain_band_w: 0.24,
    stain_floor: 0.05, crack_guard: 0.45,
    // L5
    light_az: 300, light_el: 52, step_shadow: 0.50, step_shadow_r: 3.2,
    section_gain: 0.50, gap_dark: 0.24,
    // L6
    rim_width: 3.0, rim_ring_w: 0.22, rim_x_w: 0.95,
    vmod_lo: 0.32, vmod_hi: 1.55, grain_amp: 0.045,
    wet_ks: 0.70, wet_shin: 30, sheen_amp: 0.16,
    crust_grain: 0.10, streak_amp: 0.18, lite_warm: 1.0, rim_burn: 0.30,
    juice_max: 0.26, juice_adv: 0.85,
    // L7
    tone_contrast: 1.045, vignette: 0.09, film_grain: 0.011, film_blur: 0.45,
    // 層トグル
    on3: 1, on4: 1, on5: 1, on6: 1, on7: 1,
  };
  const COL = {
    crack_up: [0.16, 0.13, 0.115], crack_low: [0.13, 0.115, 0.14],
    stain: [0.36, 0.145, 0.055],
    section: [0.86, 0.88, 0.885],
    core_a: [0.105, 0.036, 0.020], core_b: [0.295, 0.084, 0.040],
    crust_a: [0.40, 0.155, 0.065], crust_b: [0.55, 0.245, 0.105],
    lite: [0.70, 0.40, 0.16],
    rim_a: [0.60, 0.26, 0.07], rim_b: [0.88, 0.53, 0.175],
    pore: [0.80, 0.835, 0.845],
    spec: [1.0, 0.96, 0.88],
    juice_trans: [0.95, 0.70, 0.48],
    juice_sigmas: [3, 9, 22], juice_w: [0.45, 0.33, 0.22],
  };

  // ---------- STAGE A: 手合わせ抽出 ----------
  function extract(ref, W, H, P) {
    const N = W * H;
    const R = ref.R, G = ref.G, B = ref.B;
    const V = new Float32Array(N);
    for (let i = 0; i < N; i++) V[i] = 0.299 * R[i] + 0.587 * G[i] + 0.114 * B[i];

    let raw = new Uint8Array(N);
    for (let i = 0; i < N; i++) raw[i] = (R[i] - B[i] > P.rust_warm_th && R[i] - G[i] > P.rust_rg_th) ? 1 : 0;
    raw = removeSmall(raw, W, H, 6);
    let body = binMorph(raw, W, H, 2, true);      // dilate
    body = binMorph(body, W, H, 2, false);        // erode → closing
    body = removeSmall(body, W, H, 10);
    const filled = fillSmallHoles(body, W, H, P.hole_max);

    // 泡孔: closing前 raw の穴（1..hole_max）
    let pores0 = new Uint8Array(N);
    for (let i = 0; i < N; i++) pores0[i] = (filled[i] && !raw[i]) ? 1 : 0;
    {
      const { lab, areas } = labelCC(pores0, W, H);
      for (let i = 0; i < N; i++) {
        const l = lab[i];
        pores0[i] = (l && areas[l] >= 1 && areas[l] <= P.hole_max) ? 1 : 0;
      }
    }
    const pores = pores0;

    const rim = new Uint8Array(N);
    for (let i = 0; i < N; i++)
      rim[i] = (filled[i] && R[i] - B[i] > P.rim_warm_th && V[i] > P.rim_val_th) ? 1 : 0;

    // 亀裂
    const bh0 = grayClose(V, W, H, 3);
    const inner = binMorph(filled, W, H, 2, false); // erosion
    const crackMag = new Float32Array(N);
    for (let i = 0; i < N; i++) {
      const v = bh0[i] - V[i];
      crackMag[i] = (inner[i] || v <= 0) ? 0 : v;
    }
    let cr = new Uint8Array(N);
    for (let i = 0; i < N; i++) cr[i] = crackMag[i] > P.crack_mag_th ? 1 : 0;
    cr = removeSmall(cr, W, H, 14);
    for (let i = 0; i < N; i++) if (!cr[i]) crackMag[i] = 0;

    // 白斑
    const op = grayOpen(V, W, H, 2);
    const sp = new Uint8Array(N);
    for (let i = 0; i < N; i++) sp[i] = (V[i] - op[i] > P.speckle_th && !filled[i] && !cr[i]) ? 1 : 0;
    const dots = [];
    {
      const { lab, areas, n } = labelCC(sp, W, H);
      const sy = new Float64Array(n + 1), sx = new Float64Array(n + 1);
      for (let i = 0; i < N; i++) { const l = lab[i]; if (l) { sy[l] += (i / W) | 0; sx[l] += i % W; } }
      for (let l = 1; l <= n; l++) dots.push([sy[l] / areas[l], sx[l] / areas[l], areas[l]]);
    }

    // 縦LUT＋風化雲残差
    let excl = new Uint8Array(N);
    for (let i = 0; i < N; i++) excl[i] = (filled[i] || cr[i] || sp[i]) ? 1 : 0;
    excl = binMorph(excl, W, H, 2, true);
    const lut = new Float32Array(H * 3);
    let prev = [0, 0, 0]; let c0 = 0;
    for (let x = 0; x < W; x++) { prev[0] += R[x]; prev[1] += G[x]; prev[2] += B[x]; c0++; }
    prev = prev.map(v => v / c0);
    const rowbuf = [new Float32Array(W), new Float32Array(W), new Float32Array(W)];
    for (let y = 0; y < H; y++) {
      let m = 0;
      for (let x = 0; x < W; x++) {
        const i = y * W + x;
        if (!excl[i]) { rowbuf[0][m] = R[i]; rowbuf[1][m] = G[i]; rowbuf[2][m] = B[i]; m++; }
      }
      if (m > 12) prev = [median(rowbuf[0].subarray(0, m)), median(rowbuf[1].subarray(0, m)), median(rowbuf[2].subarray(0, m))];
      lut[y * 3] = prev[0]; lut[y * 3 + 1] = prev[1]; lut[y * 3 + 2] = prev[2];
    }
    smoothRows(lut, H, 9);
    const resid = [new Float32Array(N), new Float32Array(N), new Float32Array(N)];
    {
      const base = [new Float32Array(N), new Float32Array(N), new Float32Array(N)];
      for (let i = 0; i < N; i++) {
        const y = (i / W) | 0;
        base[0][i] = excl[i] ? lut[y * 3] : R[i];
        base[1][i] = excl[i] ? lut[y * 3 + 1] : G[i];
        base[2][i] = excl[i] ? lut[y * 3 + 2] : B[i];
      }
      for (let c = 0; c < 3; c++) {
        const low = blur(base[c], W, H, 15);
        for (let i = 0; i < N; i++) { const y = (i / W) | 0; resid[c][i] = low[i] - lut[y * 3 + c]; }
      }
    }

    // 亀裂線色LUT（行別・参照の亀裂画素の中央値 → σ9平滑）
    const crackLut = new Float32Array(H * 3);
    {
      let pc = [0.14, 0.12, 0.13];
      for (let y = 0; y < H; y++) {
        let m = 0;
        for (let x = 0; x < W; x++) {
          const i = y * W + x;
          if (cr[i]) { rowbuf[0][m] = R[i]; rowbuf[1][m] = G[i]; rowbuf[2][m] = B[i]; m++; }
        }
        if (m > 6) pc = [median(rowbuf[0].subarray(0, m)), median(rowbuf[1].subarray(0, m)), median(rowbuf[2].subarray(0, m))];
        crackLut[y * 3] = pc[0]; crackLut[y * 3 + 1] = pc[1]; crackLut[y * 3 + 2] = pc[2];
      }
      smoothRows(crackLut, H, 9);
    }
    // 地色校正: 参照の行別 平均/標準偏差（開花体外）→ σ7平滑
    const rowMeanRef = new Float32Array(H * 3), rowSdRef = new Float32Array(H * 3);
    {
      let pm = [0.5, 0.5, 0.5], ps = [0.1, 0.1, 0.1];
      for (let y = 0; y < H; y++) {
        let n = 0; const s = [0, 0, 0], s2 = [0, 0, 0];
        for (let x = 0; x < W; x++) {
          const i = y * W + x;
          if (filled[i]) continue;
          s[0] += R[i]; s[1] += G[i]; s[2] += B[i];
          s2[0] += R[i] * R[i]; s2[1] += G[i] * G[i]; s2[2] += B[i] * B[i]; n++;
        }
        if (n > 20) {
          for (let c = 0; c < 3; c++) {
            pm[c] = s[c] / n;
            ps[c] = Math.sqrt(Math.max(1e-8, s2[c] / n - pm[c] * pm[c]));
          }
        }
        for (let c = 0; c < 3; c++) { rowMeanRef[y * 3 + c] = pm[c]; rowSdRef[y * 3 + c] = ps[c]; }
      }
      smoothRows(rowMeanRef, H, 7); smoothRows(rowSdRef, H, 7);
    }

    // ---- 合成用キャッシュ（抽出にのみ依存） ----
    const notBody = new Uint8Array(N);
    for (let i = 0; i < N; i++) notBody[i] = filled[i] ? 0 : 1;
    const d_in = distToSet(notBody, W, H);
    const d_out = distToSet(filled, W, H);
    const thick = maxFilterSq(d_in, W, H, 4);
    const msB = blur(Float32Array.from(filled), W, H, 1.1);
    const nx2 = new Float32Array(N), ny2 = new Float32Array(N);
    gradNormals2D(msB, W, H, nx2, ny2);
    const rimSoft = blur(Float32Array.from(rim), W, H, 0.8);
    for (let i = 0; i < N; i++) rimSoft[i] = clamp(rimSoft[i] * 1.4, 0, 1);
    const vm = blur(V, W, H, 1.2);
    const inVals = []; for (let i = 0; i < N; i++) if (filled[i]) inVals.push(vm[i]);
    const vmMed = (median(inVals) || 1) + 1e-9;
    const f1 = fbm(W, H, [2, 5, 12], [0.5, 0.32, 0.18], 21);
    const f2 = fbm(W, H, [3, 8, 18], [0.5, 0.3, 0.2], 33);
    const f7 = fbm(W, H, [4, 9, 20, 44], [0.45, 0.28, 0.17, 0.10], 7);
    const f44 = fbm(W, H, [2, 6], [0.6, 0.4], 44);
    const hgt = new Float32Array(N);
    { const hb = blur(Float32Array.from(filled), W, H, 2.2); for (let i = 0; i < N; i++) hgt[i] = hb[i] * 1.6 + f44[i] * 0.5; }
    const nx3 = new Float32Array(N), ny3 = new Float32Array(N), nz3 = new Float32Array(N);
    gradNormals3D(hgt, W, H, nx3, ny3, nz3);
    const softCr11 = blur(crackMag, W, H, 1.1);
    // 塗膜の艶用 — 参照輝度の低周波を地の高さと読む（抽出）
    const hgG = blur(V, W, H, 18);
    const nxG = new Float32Array(N), nyG = new Float32Array(N), nzG = new Float32Array(N);
    { const hs = new Float32Array(N); for (let i = 0; i < N; i++) hs[i] = hgG[i] * 6.0;
      gradNormals3D(hs, W, H, nxG, nyG, nzG); }
    const juiceSrc = new Float32Array(N);
    { const bb = blur(Float32Array.from(filled), W, H, 1.0);
      const sc = blur(crackMag, W, H, 1.0);
      for (let i = 0; i < N; i++) juiceSrc[i] = clamp(bb[i] + clamp(sc[i] / 0.1, 0, 1) * 0.45, 0, 1); }
    const poreSoft = blur(Float32Array.from(pores), W, H, 0.6);
    { let mx = 1e-9; for (let i = 0; i < N; i++) if (poreSoft[i] > mx) mx = poreSoft[i];
      for (let i = 0; i < N; i++) { const a = clamp(poreSoft[i] / mx, 0, 1); poreSoft[i] = (pores[i] || a > 0.25) ? a : 0; } }
    const grainL = new Float32Array(N), grainC = [new Float32Array(N), new Float32Array(N), new Float32Array(N)];
    { const rnd = mulberry32(777);
      for (let i = 0; i < N; i++) grainL[i] = gauss2(rnd);
      for (let c = 0; c < 3; c++) for (let i = 0; i < N; i++) grainC[c][i] = gauss2(rnd); }
    // 白斑の計測密度場（微細母集団のキャリア）
    const dotDensity = new Float32Array(N);
    for (const [cy, cx, area] of dots) {
      const iy = clamp(Math.round(cy), 0, H - 1), ix = clamp(Math.round(cx), 0, W - 1);
      dotDensity[iy * W + ix] += Math.sqrt(area);
    }
    { const dd = blur(dotDensity, W, H, 4.0);
      const srt = Float32Array.from(dd).sort();
      const hi = Math.max(pct(srt, 0.97), 1e-6);
      for (let i = 0; i < N; i++) dotDensity[i] = clamp(dd[i] / hi, 0, 1); }
    // 微細泡孔の粒（正の粒だけ残す）
    const microGrain = new Float32Array(N);
    { const rnd = mulberry32(888);
      for (let i = 0; i < N; i++) microGrain[i] = gauss2(rnd);
      const mg = blur(microGrain, W, H, 0.7);
      let mx = 1e-9; for (let i = 0; i < N; i++) { const a = Math.abs(mg[i]); if (a > mx) mx = a; }
      for (let i = 0; i < N; i++) { const v = Math.max(0, mg[i] / mx); microGrain[i] = Math.pow(v, 1.5); } }
    // 筋（縦伸長の異方性ノイズ）
    const streak = new Float32Array(N);
    { const rnd = mulberry32(55);
      for (let i = 0; i < N; i++) streak[i] = gauss2(rnd);
      const st = blurAniso(streak, W, H, 0.9, 7.0);
      let mx = 1e-9; for (let i = 0; i < N; i++) { const a = Math.abs(st[i]); if (a > mx) mx = a; }
      for (let i = 0; i < N; i++) streak[i] = st[i] / mx; }
    // 開花体内部の明度分位（三状態: 湿潤核/痂皮/明部）
    let vmQ33 = 0.3, vmQ66 = 0.5;
    { const inv = []; for (let i = 0; i < N; i++) if (filled[i]) inv.push(vm[i]);
      const srt = Float32Array.from(inv).sort();
      vmQ33 = pct(srt, 0.33) || vmQ33; vmQ66 = pct(srt, 0.66) || vmQ66; }
    // 三状態パレットを参照からゾーン別サンプリング（p30/p70）— 定数パレット廃止
    const statePal = [];
    const vmMedZ = [0.25, 0.45, 0.65];
    {
      const zone = new Int8Array(N).fill(-1);
      for (let i = 0; i < N; i++) {
        if (!filled[i]) continue;
        const s1 = vm[i] > vmQ33 * 1.02 ? 1 : 0, s2 = vm[i] > vmQ66 * 1.02 ? 1 : 0;
        zone[i] = s2 ? 2 : (s1 ? 1 : 0);
      }
      for (let z = 0; z < 3; z++) {
        const rr = [], gg = [], bb = [], vv = [];
        for (let i = 0; i < N; i++) if (zone[i] === z) { rr.push(R[i]); gg.push(G[i]); bb.push(B[i]); vv.push(vm[i]); }
        const sR = Float32Array.from(rr).sort(), sG = Float32Array.from(gg).sort(), sB = Float32Array.from(bb).sort();
        statePal.push({ a: [pct(sR, 0.30) || 0.2, pct(sG, 0.30) || 0.1, pct(sB, 0.30) || 0.05],
                        b: [pct(sR, 0.70) || 0.4, pct(sG, 0.70) || 0.2, pct(sB, 0.70) || 0.1] });
        const sV = Float32Array.from(vv).sort();
        if (vv.length) vmMedZ[z] = pct(sV, 0.50);
      }
    }
    // リムパレットも参照実位置からサンプリング（p35/p75）
    let rimPal = { a: [0.60, 0.26, 0.07], b: [0.88, 0.53, 0.175] };
    {
      const rr = [], gg = [], bb = [];
      for (let i = 0; i < N; i++) if (rim[i]) { rr.push(R[i]); gg.push(G[i]); bb.push(B[i]); }
      if (rr.length > 50) {
        const sR = Float32Array.from(rr).sort(), sG = Float32Array.from(gg).sort(), sB = Float32Array.from(bb).sort();
        rimPal = { a: [pct(sR, 0.35), pct(sG, 0.35), pct(sB, 0.35)],
                   b: [pct(sR, 0.75), pct(sG, 0.75), pct(sB, 0.75)] };
      }
    }
    const shadowRand = new Float32Array(dots.length);
    { const rnd = mulberry32(555); for (let i = 0; i < dots.length; i++) shadowRand[i] = rnd(); }
    const bodyD1 = binMorph(filled, W, H, 1, true);
    const nBloom = labelCC(filled, W, H).n;
    let crackPx = 0; for (let i = 0; i < N; i++) if (cr[i]) crackPx++;
    let nPores = labelCC(pores, W, H).n;

    return {
      W, H, ref, V, body: filled, rim, pores, crack: cr, crackMag, dots, lut, resid,
      crackLut, rowMeanRef, rowSdRef,
      d_in, d_out, thick, nx2, ny2, rimSoft, vm, vmMed, f1, f2, f7,
      hgt, nx3, ny3, nz3, softCr11, juiceSrc, poreSoft, grainL, grainC, shadowRand, bodyD1,
      dotDensity, microGrain, streak, vmQ33, vmQ66, vmMedZ, nxG, nyG, nzG, statePal, rimPal,
      counts: { blooms: nBloom, pores: nPores, speckle: dots.length, crack_px: crackPx },
    };
  }

  function gradNormals2D(ms, W, H, nx, ny) {
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const i = y * W + x;
      const gx = (ms[y * W + Math.min(x + 1, W - 1)] - ms[y * W + Math.max(x - 1, 0)]) * 0.5;
      const gy = (ms[Math.min(y + 1, H - 1) * W + x] - ms[Math.max(y - 1, 0) * W + x]) * 0.5;
      const nn = Math.hypot(gx, gy) + 1e-9;
      nx[i] = -gx / nn; ny[i] = -gy / nn;
    }
  }
  function gradNormals3D(h, W, H, nx, ny, nz) {
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const i = y * W + x;
      const gx = (h[y * W + Math.min(x + 1, W - 1)] - h[y * W + Math.max(x - 1, 0)]) * 0.5;
      const gy = (h[Math.min(y + 1, H - 1) * W + x] - h[Math.max(y - 1, 0) * W + x]) * 0.5;
      const inz = 1 / Math.sqrt(gx * gx + gy * gy + 1);
      nx[i] = -gx * inz; ny[i] = -gy * inz; nz[i] = inz;
    }
  }

  // ---------- STAGE B: 合成 ----------
  function synth(E, P) {
    const { W, H } = E; const N = W * H;
    const out = [new Float32Array(N), new Float32Array(N), new Float32Array(N)];
    // L2 塗膜場
    for (let i = 0; i < N; i++) {
      const y = (i / W) | 0;
      for (let c = 0; c < 3; c++)
        out[c][i] = clamp(E.lut[y * 3 + c] + E.resid[c][i] * P.resid_w + E.f7[i] * P.fbm_amp, 0, 1);
    }
    // L2.5 清拭ハロー — 開花体周縁ではペンキ膜が拭われて見える（白斑/亀裂/染色を減衰）
    let haloF = null;
    if (P.paint_clean > 0) {
      haloF = new Float32Array(N);
      const rc = Math.max(0.5, P.paint_clean_r);
      for (let i = 0; i < N; i++)
        haloF[i] = E.body[i] ? 0 : P.paint_clean * Math.exp(-Math.max(0, E.d_out[i] - 1.5) / rc);
    }
    // L3 白斑 — 二母集団（微細=計測密度場×粒 / 粗大=離散膨れ）
    if (P.on3) {
      const acc = new Float32Array(N), sh = new Float32Array(N);
      for (let d = 0; d < E.dots.length; d++) {
        const [cy, cx, area] = E.dots[d];
        if (area < P.dot_big_area) continue;               // 微細側は密度場に委譲
        const iy = Math.round(cy), ix = Math.round(cx);
        const ii = Math.min(iy, H - 1) * W + Math.min(ix, W - 1);
        if (E.bodyD1[ii]) continue;
        const rad = Math.max(0.7, Math.sqrt(area / Math.PI)) * P.dot_rad_scale;
        const bf = 0.45 + 0.55 * sstep(rad, 0.8, 2.4);     // 輝度は径に従属
        const k = Math.max(2, Math.floor(rad * 2.2));
        const s2 = 2 * (rad * 0.62) * (rad * 0.62);
        for (let yy = Math.max(0, iy - k); yy < Math.min(H, iy + k + 1); yy++)
          for (let xx = Math.max(0, ix - k); xx < Math.min(W, ix + k + 1); xx++) {
            const d2 = (yy - cy) * (yy - cy) + (xx - cx) * (xx - cx);
            acc[yy * W + xx] += bf * Math.exp(-d2 / s2);
          }
        if (E.shadowRand[d] < P.dot_shadow_fr) {
          const s3 = 2 * (rad * 0.5) * (rad * 0.5);
          const oy = cy + rad * 0.9, ox = cx + rad * 0.4;
          for (let yy = Math.max(0, iy - k); yy < Math.min(H, iy + k + 1); yy++)
            for (let xx = Math.max(0, ix - k); xx < Math.min(W, ix + k + 1); xx++)
              sh[yy * W + xx] += 0.5 * Math.exp(-((yy - oy) * (yy - oy) + (xx - ox) * (xx - ox)) / s3);
        }
      }
      for (let i = 0; i < N; i++) {
        const y = (i / W) | 0;
        const hh = haloF ? haloF[i] : 0;
        const cut = (1 - P.dot_low_cut * sstep(y / H, 0.42, 0.62)) * (1 - hh);   // 下帯抑制＋清拭
        const micro = (E.bodyD1[i] ? 0 : E.microGrain[i] * E.dotDensity[i] * P.micro_gain * 4.0) * cut;
        const a = Math.min(1, clamp(acc[i], 0, 1) * P.dot_gain * cut + micro);
        const shv = 1 - clamp(sh[i], 0, 1) * 0.10;
        for (let c = 0; c < 3; c++) {
          const pale = clamp(out[c][i] + 0.22 + (c === 2 ? 0.015 : 0), 0, 1);
          out[c][i] = (out[c][i] * (1 - a) + pale * a) * shv;
        }
      }
    }
    // L4 亀裂＋染色
    let crackSoft = null;
    if (P.on4) {
      crackSoft = blur(E.crackMag, W, H, P.crack_widen);
      const soft = crackSoft;
      for (let i = 0; i < N; i++) {
        const y = (i / W) | 0;
        const wlow = sstep(y / H, 0.42, 0.62);
        const hh = haloF ? haloF[i] : 0;
        let a = clamp(soft[i] / 0.095, 0, 1) * P.crack_strength * (1 + P.crack_low_bst * wlow) * (1 - hh * 0.85);
        a = clamp(a, 0, 1);
        if (a > 0) for (let c = 0; c < 3; c++) {
          const col = E.crackLut[y * 3 + c];   // 参照から行別抽出した線色
          out[c][i] = out[c][i] * (1 - a) + col * a;
        }
        const bq = (y / H - P.stain_band_c) / P.stain_band_w;
        const band = Math.exp(-(bq * bq));
        let sa = clamp(E.softCr11[i] / 0.10, 0, 1) * Math.exp(-E.d_out[i] / P.stain_lambda) *
                 Math.max(band, P.stain_floor) * P.stain_gain * (1 - hh * 0.6);
        sa = clamp(sa, 0, 0.9) * 0.75;
        if (sa > 0) for (let c = 0; c < 3; c++)
          out[c][i] = out[c][i] * (1 - sa) + COL.stain[c] * sa;
      }
    }
    // L4.5 ペンキの清拭 — 開花体周縁を行の明側塗膜色へ寄せる（剥離前縁の浮き）
    if (haloF) {
      for (let i = 0; i < N; i++) {
        if (E.body[i]) continue;
        const t = haloF[i] * 0.6;
        if (t <= 0.002) continue;
        const y = (i / W) | 0;
        for (let c = 0; c < 3; c++) {
          const tgt = Math.min(1, E.rowMeanRef[y * 3 + c] + 0.55 * E.rowSdRef[y * 3 + c]);

const P = Object.assign({}, C.DEFAULTS);

// ---- UI構築 ----
function buildSliders() {
  const host = $("sliders");
  for (const [group, rows] of SYNTH_SLIDERS) {
    const d = document.createElement("details");
    if (group.startsWith("L6")) d.open = true;
    const s = document.createElement("summary"); s.textContent = group; d.appendChild(s);
    for (const [key, label, mn, mx, st] of rows) d.appendChild(sliderRow(key, label, mn, mx, st, false));
    host.appendChild(d);
  }
  const ex = $("exsliders");
  for (const [key, label, mn, mx, st] of EXTRACT_SLIDERS) ex.appendChild(sliderRow(key, label, mn, mx, st, true));
}
function sliderRow(key, label, mn, mx, st, isExtract) {
  const row = document.createElement("div"); row.className = "sl";
  const lb = document.createElement("label"); lb.textContent = label;
  const inp = document.createElement("input");
  inp.type = "range"; inp.min = mn; inp.max = mx; inp.step = st; inp.value = P[key];
  inp.dataset.key = key;
  const out = document.createElement("output"); out.textContent = fmt(P[key]);
  inp.addEventListener("input", () => {
    P[key] = parseFloat(inp.value); out.textContent = fmt(P[key]);
    if (!isExtract) scheduleRender();
  });
  row.append(lb, inp, out);
  return row;
}
const fmt = (v) => (Math.abs(v) >= 10 ? v.toFixed(0) : v.toFixed(3).replace(/0+$/, "").replace(/\.$/, ""));

// ---- 描画 ----
function arrsToImageData(arrs, w, h) {
  const id = new ImageData(w, h);
  for (let i = 0; i < w * h; i++) {
    id.data[i * 4]     = Math.round(Math.min(1, Math.max(0, arrs[0][i])) * 255);
    id.data[i * 4 + 1] = Math.round(Math.min(1, Math.max(0, arrs[1][i])) * 255);
    id.data[i * 4 + 2] = Math.round(Math.min(1, Math.max(0, arrs[2][i])) * 255);
    id.data[i * 4 + 3] = 255;
  }
  return id;
}
const cvOf = (id) => { const c = document.createElement("canvas"); c.width = id.width; c.height = id.height; c.getContext("2d").putImageData(id, 0, 0); return c; };
let refCv = null, twinCv = null, ovCv = null;

function draw() {
  const view = document.querySelector('input[name=view]:checked').value;
  const cnv = $("main"), ctx = cnv.getContext("2d");
  const blend = parseFloat($("blend").value);
  const showTwin = $("blink").checked ? blinkPhase : null;
  if (view === "sbs") {
    cnv.width = W * 2 + 8; cnv.height = H;
    ctx.fillStyle = "#f2f0e9"; ctx.fillRect(0, 0, cnv.width, H);
    if (refCv) ctx.drawImage(refCv, 0, 0);
    if (twinCv) ctx.drawImage(twinCv, W + 8, 0);
  } else {
    cnv.width = W; cnv.height = H;
    if (view === "ref") { if (refCv) ctx.drawImage(refCv, 0, 0); }
    else if (view === "teawase") { if (ovCv) ctx.drawImage(ovCv, 0, 0); }
    else { // twin（ブレンド／点滅）
      if (showTwin === null) {
        if (refCv) ctx.drawImage(refCv, 0, 0);
        if (twinCv) { ctx.globalAlpha = blend; ctx.drawImage(twinCv, 0, 0); ctx.globalAlpha = 1; }
      } else {
        ctx.drawImage(showTwin ? twinCv : refCv, 0, 0);
      }
    }
  }
  if (refCv) $("miniRef").getContext("2d").drawImage(refCv, 0, 0);
  if (twinCv) $("miniTwin").getContext("2d").drawImage(twinCv, 0, 0);
}

function render() {
  status("焼成中…");
  requestAnimationFrame(() => setTimeout(() => {
    const t0 = performance.now();
    const out = C.synth(E, P);
    twinID = arrsToImageData(out, W, H);
    twinCv = cvOf(twinID);
    status("焼成 " + Math.round(performance.now() - t0) + "ms — スクワントで参照と見比べ、残差を名指しする");
    draw();
  }, 16));
}
function scheduleRender() {
  clearTimeout(renderTimer);
  renderTimer = setTimeout(render, 140);
}

function runExtract(then) {
  status("手合わせ抽出中…（数秒）");
  requestAnimationFrame(() => setTimeout(() => {
    const t0 = performance.now();
    E = C.extract(refArr, W, H, P);
    ovID = arrsToImageData(C.overlay(E), W, H);
    ovCv = cvOf(ovID);
    $("cBloom").textContent = E.counts.blooms;
    $("cPore").textContent = E.counts.pores;
    $("cDot").textContent = E.counts.speckle;
    $("cCrack").textContent = (E.counts.crack_px / 1000).toFixed(0) + "k";
    status("抽出 " + Math.round(performance.now() - t0) + "ms");
    then && then();
  }, 16));
}

// ---- 起動 ----
function boot() {
  buildSliders();
  const img = new Image();
  img.onload = () => {
    W = img.naturalWidth; H = img.naturalHeight;
    const c = document.createElement("canvas"); c.width = W; c.height = H;
    const cx = c.getContext("2d", { willReadFrequently: true });
    cx.drawImage(img, 0, 0);
    const d = cx.getImageData(0, 0, W, H).data;
    const N = W * H;
    refArr = { R: new Float32Array(N), G: new Float32Array(N), B: new Float32Array(N) };
    for (let i = 0; i < N; i++) { refArr.R[i] = d[i*4]/255; refArr.G[i] = d[i*4+1]/255; refArr.B[i] = d[i*4+2]/255; }
    refID = new ImageData(new Uint8ClampedArray(d), W, H);
    refCv = cvOf(refID);
    $("main").width = W; $("main").height = H;
    runExtract(render);
  };
  img.onerror = () => { status("参照画像の読込に失敗"); };
  img.src = "data:image/jpeg;base64," + REF_B64;

  document.querySelectorAll('input[name=view]').forEach(r => r.addEventListener("change", draw));
  $("blend").addEventListener("input", draw);
  $("squint").addEventListener("change", () => $("stage").classList.toggle("squint", $("squint").checked));
  $("blink").addEventListener("change", () => {
    clearInterval(blinkTimer);
    if ($("blink").checked) blinkTimer = setInterval(() => { blinkPhase = !blinkPhase; draw(); }, 320);
    else draw();
  });
  document.querySelectorAll('#toggles input').forEach(t => t.addEventListener("change", () => {
    P[t.dataset.on] = t.checked ? 1 : 0; scheduleRender();
  }));
  $("reextract").addEventListener("click", () => runExtract(render));
  $("export").addEventListener("click", () => {
    const j = JSON.stringify({ engine: "sabigaki_utsushi_lab v0.5", reference: "Calligraphy__1_.jpg",
      counts: E ? E.counts : null, P }, null, 1);
    $("json").value = j;
    if (navigator.clipboard) navigator.clipboard.writeText(j).catch(() => {});
  });
  $("ledger").addEventListener("click", () => {
    if (!E) return;
    status("台帳計測中…");
    setTimeout(() => {
      const t0 = performance.now();
      const L = C.ledger(E, P);
      const j = JSON.stringify(L, null, 1);
      $("json").value = j;
      const a = document.createElement("a");
      a.download = "sabigaki_bunpo_daicho.json";
      a.href = "data:application/json;charset=utf-8," + encodeURIComponent(j);
      a.click();
      if (navigator.clipboard) navigator.clipboard.writeText(j).catch(() => {});
      status("台帳 " + Math.round(performance.now() - t0) + "ms — 蒸留の合格基準はこの分布");
    }, 16);
  });
  const EXTRACT_KEYS = new Set(EXTRACT_SLIDERS.map(r => r[0]).concat(["hole_max"]));
  $("import").addEventListener("click", () => {
    let obj;
    try { obj = JSON.parse($("json").value); } catch (e) { status("JSONが読めない: " + e.message); return; }
    const src = obj && obj.P ? obj.P : obj;
    if (!src || typeof src !== "object") { status("調律JSONの形式が違う（P が見つからない）"); return; }
    if (typeof src.calib_w === "number" && typeof src.calib_mean !== "number") src.calib_mean = src.calib_w;
    let exChanged = false;
    for (const k of Object.keys(C.DEFAULTS)) {
      if (typeof src[k] === "number") {
        if (EXTRACT_KEYS.has(k) && src[k] !== P[k]) exChanged = true;
        P[k] = src[k];
      }
    }
    document.querySelectorAll(".sl").forEach(row => {
      const inp = row.querySelector("input"), out = row.querySelector("output");
      const key = inp.dataset.key;
      if (key && typeof P[key] === "number") { inp.value = P[key]; out.textContent = fmt(P[key]); }
    });
    document.querySelectorAll('#toggles input').forEach(t => { t.checked = !!P[t.dataset.on]; });
    status(exChanged ? "調律を復元 — 抽出系が変わったため再抽出中…" : "調律を復元");
    if (exChanged) runExtract(render); else render();
  });
  $("save").addEventListener("click", () => {
    if (!twinCv) return;
    const a = document.createElement("a");
    a.download = "sabigaki_twin.png";
    a.href = twinCv.toDataURL("image/png");
    a.click();
  });
}
boot();
</script>
</body>
</html>
