<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Structure Designer - 広がる渦巻きロゴ</title>
    <style>
        /* 背景とレイアウト */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #f5f5f5;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        
        /* ロゴコンテナ（重要！） */
        .logo-container {
            /* 初期状態を小さく設定 */
            transform: scale(0.05);
            /* 拡大アニメーション */
            animation: expandContainer 3s ease-out forwards;
        }
        
        /* SVGロゴのスタイル */
        .logo {
            width: 200px;
            height: 200px;
            display: block;
            /* 回転のみのアニメーション */
            animation: rotateOnly 30s linear infinite;
        }
        
        /* コンテナの拡大アニメーション */
        @keyframes expandContainer {
            0% {
                transform: scale(0.05) rotate(0deg);
                opacity: 0.5;
            }
            100% {
                transform: scale(1) rotate(360deg);
                opacity: 1;
            }
        }
        
        /* 永続的な回転アニメーション */
        @keyframes rotateOnly {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }
        
        /* 会社名（最初は非表示） */
        .company-name {
            margin-top: 30px;
            font-size: 24px;
            letter-spacing: 5px;
            color: #333;
            text-align: center;
            opacity: 0;
            /* 文字は3秒後に表示開始 */
            animation: fadeInText 1s ease-out 3s forwards;
        }
        
        /* 文字のフェードイン */
        @keyframes fadeInText {
            to {
                opacity: 1;
            }
        }
        
        /* エフェクト用の円 */
        .effect-circle {
            position: absolute;
            width: 300px;
            height: 300px;
            border: 2px solid rgba(0, 0, 0, 0.1);
            border-radius: 50%;
            animation: ripple 3s ease-out forwards;
        }
        
        /* 波紋エフェクト */
        @keyframes ripple {
            0% {
                transform: scale(0);
                opacity: 1;
            }
            100% {
                transform: scale(1.5);
                opacity: 0;
            }
        }
        
        /* デバッグ用スタイル */
        .debug-info {
            position: fixed;
            bottom: 20px;
            left: 20px;
            font-size: 12px;
            color: #666;
            background: rgba(255, 255, 255, 0.9);
            padding: 10px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <!-- 波紋エフェクト -->
    <div class="effect-circle"></div>
    
    <!-- ロゴコンテナ（重要！） -->
    <div class="logo-container">
        <!-- SVGロゴ -->
        <img src="logo.svg" alt="Structure Designer Logo" class="logo">
    </div>
    
    <!-- 会社名 -->
    <div class="company-name">
        STRUCTURE<br>DESIGNER
    </div>
</body>
</html>
