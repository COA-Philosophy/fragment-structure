<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Structure Designer - パルスロゴ</title>
    <style>
        /* 背景とレイアウト */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #f5f5f5;
            font-family: Arial, sans-serif;
        }
        
        /* SVGロゴのスタイル */
        .logo {
            width: 200px;
            height: 200px;
            /* パルスアニメーション */
            animation: heartbeat 2s ease-in-out infinite;
        }
        
        /* 心電図スタイルのパルスアニメーション */
        @keyframes heartbeat {
            0% {
                transform: scale(1);
                opacity: 0.7;
            }
            10% {
                transform: scale(1.1);
                opacity: 1;
            }
            15% {
                transform: scale(1);
                opacity: 0.7;
            }
            100% {
                transform: scale(1);
                opacity: 0.7;
            }
        }
        
        /* 会社名 */
        .company-name {
            margin-top: 40px;
            font-size: 24px;
            letter-spacing: 5px;
            color: #333;
            text-align: center;
        }
        
        /* オプション：影のパルス効果 */
        .logo-shadow {
            position: absolute;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(0,0,0,0.1) 0%, transparent 70%);
            border-radius: 50%;
            z-index: -1;
            animation: shadowPulse 2s ease-in-out infinite;
        }
        
        /* 影のアニメーション */
        @keyframes shadowPulse {
            0% {
                transform: scale(1);
                opacity: 0.2;
            }
            10% {
                transform: scale(1.3);
                opacity: 0.5;
            }
            15% {
                transform: scale(1);
                opacity: 0.2;
            }
            100% {
                transform: scale(1);
                opacity: 0.2;
            }
        }
        
        /* ロゴコンテナ */
        .logo-container {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* 光のエフェクト（新規追加） */
        .glow-effect {
            position: absolute;
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, rgba(0,0,0,0.08) 0%, transparent 60%);
            border-radius: 50%;
            z-index: -2;
            animation: glowPulse 2s ease-in-out infinite;
        }
        
        @keyframes glowPulse {
            0% {
                transform: scale(0.9);
                opacity: 0;
            }
            10% {
                transform: scale(1.1);
                opacity: 0.8;
            }
            15% {
                transform: scale(0.95);
                opacity: 0;
            }
            100% {
                transform: scale(0.9);
                opacity: 0;
            }
        }
        
        /* ハートビートインジケーター（オプション） */
        .heartbeat-line {
            position: fixed;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            color: #999;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .heart-icon {
            color: #ff6b6b;
            animation: heartIcon 2s ease-in-out infinite;
        }
        
        @keyframes heartIcon {
            0% { transform: scale(1); }
            10% { transform: scale(1.3); }
            15% { transform: scale(1); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <!-- ロゴコンテナ -->
    <div class="logo-container">
        <!-- 光のエフェクト -->
        <div class="glow-effect"></div>
        <!-- 影のエフェクト -->
        <div class="logo-shadow"></div>
        <!-- SVGロゴ -->
        <img src="logo.svg" alt="Structure Designer Logo" class="logo">
    </div>
    
    <!-- 会社名 -->
    <div class="company-name">
        STRUCTURE<br>DESIGNER
    </div>
    
    <!-- ハートビートインジケーター -->
    <div class="heartbeat-line">
        <span class="heart-icon">♥</span>
        <span>heartbeat animation</span>
    </div>
</body>
</html>
