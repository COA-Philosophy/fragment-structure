<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SILAS — 雲海の夜明け（コード生成LP背景）</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@200;300;400;500&family=Lora:wght@400;500&display=swap');
@import url('https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500&display=swap');
:root{
  --ink:#262420;--ink-soft:#3c382f;--ink-mid:#6b6557;
  --paper:#f4efe6;--line:#d9d1c2;--beige:#cfc6b3;--beige-soft:#e6ded0;
  --sans:'Satoshi',ui-sans-serif,system-ui,sans-serif;
  --serifjp:'Noto Serif JP',serif;--serif:'Lora',Georgia,serif;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{font-family:var(--sans);color:var(--ink);background:#e9e3d8;-webkit-font-smoothing:antialiased;}

.hero{position:relative;width:100%;height:clamp(580px,94vh,920px);overflow:hidden;background:#e7e0d4;}
#sky{position:absolute;inset:0;width:100%;height:100%;display:block;opacity:0;transition:opacity 1.1s ease;}
#sky.in{opacity:1;}

/* scenery overlay (rock + figure + brand arcs) */
.scene{position:absolute;inset:0;pointer-events:none;}
.arcs{position:absolute;top:6%;right:4%;width:min(560px,52vw);height:min(560px,52vw);opacity:.9;}
.arcs circle,.arcs line{fill:none;stroke:#8d8270;stroke-width:1;}
.arcs .dot{fill:#8d8270;stroke:none;}
.rock{position:absolute;right:0;bottom:-1px;width:min(56%,760px);height:auto;}

/* chrome */
.nav{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;
  padding:26px clamp(28px,5vw,72px);z-index:5;}
.logo{font-family:var(--serif);font-weight:500;font-size:26px;letter-spacing:.22em;color:var(--ink);padding-left:.22em;}
.navlinks{display:flex;align-items:center;gap:clamp(18px,2.4vw,40px);}
.navlinks a{font-family:var(--sans);font-weight:500;font-size:13px;letter-spacing:.06em;color:var(--ink-soft);text-decoration:none;}
.navlinks a:hover{color:var(--ink);}
.navcta{font-family:var(--sans);font-weight:500;font-size:13px;letter-spacing:.08em;color:var(--ink);
  background:rgba(207,198,179,.7);border:1px solid rgba(160,150,130,.5);border-radius:3px;padding:11px 20px;}
.navcta:hover{background:rgba(207,198,179,.95);}
@media(max-width:880px){.navlinks a{display:none;}}

.copy{position:absolute;top:26%;left:clamp(28px,5vw,72px);z-index:5;max-width:640px;}
.copy h1{font-family:var(--serifjp);font-weight:400;font-size:clamp(38px,6.4vw,76px);line-height:1.28;
  letter-spacing:.04em;color:var(--ink);}
.copy p{font-family:var(--serifjp);font-weight:300;font-size:clamp(14px,1.5vw,18px);line-height:2.0;
  letter-spacing:.05em;color:var(--ink-soft);margin-top:30px;max-width:30em;}
.cta{display:flex;gap:16px;margin-top:36px;flex-wrap:wrap;}
.btn{font-family:var(--sans);font-weight:500;font-size:14px;letter-spacing:.06em;border-radius:4px;
  padding:16px 28px;display:inline-flex;align-items:center;gap:18px;cursor:pointer;transition:.2s;}
.btn .ar{font-family:var(--sans);font-weight:300;}
.btn.solid{background:var(--ink);color:#f4efe6;border:1px solid var(--ink);}
.btn.solid:hover{background:#000;}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid rgba(80,74,62,.45);}
.btn.ghost:hover{border-color:var(--ink);}
</style>
</head>
<body>

<section class="hero" id="hero">
  <canvas id="sky"></canvas>

  <div class="scene">
    <!-- brand arcs (SILAS) -->
    <svg class="arcs" viewBox="0 0 560 560" aria-hidden="true">
      <g transform="translate(330 250)">
        <circle r="70"  opacity=".22"/>
        <circle r="138" opacity=".18"/>
        <circle r="206" opacity=".13"/>
        <circle r="262" opacity=".09"/>
        <line x1="-262" y1="0" x2="262" y2="0" opacity=".10"/>
        <circle class="dot" cx="138" cy="-2" r="2.4" opacity=".5"/>
        <circle class="dot" cx="-206" cy="0" r="2" opacity=".4"/>
        <circle class="dot" cx="48" cy="-201" r="2.2" opacity=".45"/>
        <circle class="dot" cx="206" cy="40" r="1.8" opacity=".4"/>
        <line x1="206" y1="-150" x2="226" y2="-150" opacity=".22"/>
        <line x1="216" y1="-158" x2="216" y2="-142" opacity=".22"/>
      </g>
    </svg>

    <!-- foreground summit + figure -->
    <svg class="rock" viewBox="0 0 760 360" preserveAspectRatio="xMaxYMax meet" aria-hidden="true">
      <defs>
        <linearGradient id="rockg" x1="0" y1="0" x2="0.5" y2="1">
          <stop offset="0" stop-color="#39342b"/>
          <stop offset="1" stop-color="#211f1a"/>
        </linearGradient>
        <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0.4">
          <stop offset="0" stop-color="rgba(245,236,222,0)"/>
          <stop offset="1" stop-color="rgba(245,236,222,.30)"/>
        </linearGradient>
        <radialGradient id="basehaze" cx="0.35" cy="0.1" r="0.9">
          <stop offset="0" stop-color="rgba(244,238,228,.65)"/>
          <stop offset="1" stop-color="rgba(244,238,228,0)"/>
        </radialGradient>
      </defs>
      <!-- mist licking the base -->
      <rect x="0" y="250" width="760" height="120" fill="url(#basehaze)"/>
      <path d="M70,360 L88,300 122,322 150,250 188,238 226,168 252,128
               278,176 312,150 348,206 392,176 430,232 474,206 520,256
               566,228 612,272 664,248 712,288 760,266 760,360 Z"
            fill="url(#rockg)"/>
      <!-- lit rim toward the dawn (right) -->
      <path d="M252,128 278,176 312,150 348,206 392,176 430,232 474,206 520,256
               566,228 612,272 664,248 712,288 760,266"
            fill="none" stroke="url(#rim)" stroke-width="2.2" stroke-linejoin="round"/>
      <!-- standing figure on the peak, facing the sea -->
      <g transform="translate(250 128)" fill="#1a1815">
        <ellipse cx="0" cy="-30" rx="5.4" ry="6.2"/>
        <path d="M-6,-24 C-8,-12 -7,2 -5,16 L-1,16 L0,-2 L1,16 L5,16
                 C7,2 8,-12 6,-24 C3,-27 -3,-27 -6,-24 Z"/>
      </g>
    </svg>
  </div>

  <!-- chrome -->
  <header class="nav">
    <div class="logo">SILAS</div>
    <nav class="navlinks">
      <a href="#">Concept</a><a href="#">Experience</a><a href="#">Diagnosis</a>
      <a href="#">Log</a><a href="#">FAQ</a>
      <a class="navcta" href="#">診断をはじめる</a>
    </nav>
  </header>

  <div class="copy">
    <h1>あなたの流れを、<br>静かに読み解く。</h1>
    <p>SILASは、生年月日と日々の記録から、<br>思考・感情・行動のパターンを見つめる自己理解AIです。</p>
    <div class="cta">
      <button class="btn solid">2分で構造をみる<span class="ar">⟶</span></button>
      <button class="btn ghost">体験を見る<span class="ar">⟶</span></button>
    </div>
  </div>
</section>

<script>
(function(){
  const SEED = 0x5a17;                     // 夜明けの種 — 診断値に差し替え可能
  const cv = document.getElementById('sky');
  const ctx = cv.getContext('2d', {alpha:true});
  const hero = document.getElementById('hero');
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---------- seeded periodic value-noise + fbm ----------
  function ihash(ix,iy,seed){
    let h = (Math.imul(ix|0,374761393) ^ Math.imul(iy|0,668265263) ^ Math.imul(seed|0,1274126177))|0;
    h = Math.imul(h ^ (h>>>13), 1274126177);
    h ^= h>>>16;
    return (h>>>0)/4294967296;
  }
  const sm = t => t*t*(3-2*t);
  function vnoise(x,y,per,seed){
    const ix=Math.floor(x), iy=Math.floor(y);
    const ux=sm(x-ix), uy=sm(y-iy);
    const x0=((ix%per)+per)%per, x1=(x0+1)%per;
    const v00=ihash(x0,iy,seed),   v10=ihash(x1,iy,seed);
    const v01=ihash(x0,iy+1,seed), v11=ihash(x1,iy+1,seed);
    const a=v00+(v10-v00)*ux, b=v01+(v11-v01)*ux;
    return a+(b-a)*uy;
  }
  function fbm(x,y,per,seed,oct){
    let s=0,amp=0.5,fr=1,n=0;
    for(let o=0;o<oct;o++){ s+=amp*vnoise(x*fr,y*fr,per*fr,seed+o*131); n+=amp; amp*=0.5; fr*=2; }
    return s/n;
  }
  // domain-warped cloud density (stays periodic in x → seamless loop)
  function clouds(x,y,per,seed){
    const q = fbm(x,y,per,seed,4);
    const w = fbm(x+3.0*q+1.7, y+3.0*q+9.2, per, seed+555, 4);
    return fbm(x+3.2*w, y+3.2*w, per, seed+999, 4);
  }
  const lerp=(a,b,t)=>a+(b-a)*t;
  const clamp=(v,a,b)=>v<a?a:v>b?b:v;

  // ---------- bake one tileable cloud layer ----------
  // colours
  const C_SHADOW=[214,204,187], C_LIT=[251,246,237], C_HAZE=[243,236,224];
  function bakeLayer(per,cellPx,Ht,seed,alpha,thLo,thHi){
    const W=per*cellPx, H=Ht;
    const off=document.createElement('canvas'); off.width=W; off.height=H;
    const c=off.getContext('2d'); const img=c.createImageData(W,H); const d=img.data;
    for(let py=0;py<H;py++){
      const t = py/(H-1);                          // 0 = horizon(far) .. 1 = bottom(near)
      const ny = 1.0 + 2.6*Math.log(t*7+1);        // 俯瞰の遠近：地平線側ほど圧縮
      const haze = 1 - sm(clamp(t/0.42,0,1));      // 1 at horizon → 0 lower
      const topFade = sm(clamp(t/0.16,0,1));       // clouds fade in just below horizon
      const nearLift = 0.5+0.5*t;                  // near clouds slightly brighter/denser
      for(let px=0;px<W;px++){
        const nx = px/cellPx;
        const dn = clouds(nx, ny, per, seed);
        const cover = sm(clamp((dn-thLo)/(thHi-thLo),0,1));
        const light = clamp((dn-0.42)*1.7+0.5, 0, 1);
        let r=lerp(C_SHADOW[0],C_LIT[0],light), g=lerp(C_SHADOW[1],C_LIT[1],light), b=lerp(C_SHADOW[2],C_LIT[2],light);
        // bleach toward haze near the horizon
        r=lerp(r,C_HAZE[0],haze*0.85); g=lerp(g,C_HAZE[1],haze*0.85); b=lerp(b,C_HAZE[2],haze*0.85);
        const a = clamp(cover*alpha*topFade*(0.7+0.5*nearLift),0,1);
        const i=(py*W+px)*4;
        d[i]=r|0; d[i+1]=g|0; d[i+2]=b|0; d[i+3]=(a*255)|0;
      }
    }
    c.putImageData(img,0,0);
    return off;
  }

  // ridge silhouettes near the horizon
  function ridgePts(seed,per,amp,base){
    const pts=[]; for(let i=0;i<=per*4;i++){const x=i/4; pts.push([x, base - fbm(x,0.5,per,seed,3)*amp]);} return pts;
  }

  let layers=null, ridgeA=null, ridgeB=null, ready=false;
  function build(){
    layers=[
      {cv:bakeLayer(12,42,210, SEED+11, 0.92, 0.30,0.66), zoom:0.66, speed:5.5, vy:0.34},  // near
      {cv:bakeLayer(12,42,210, SEED+97, 0.55, 0.34,0.70), zoom:0.44, speed:3.0, vy:0.30}   // far
    ];
    ridgeA=ridgePts(SEED+3, 12, 0.18, 1.7);
    ridgeB=ridgePts(SEED+8, 12, 0.12, 2.0);
    ready=true; cv.classList.add('in');
  }

  let vw=0, vh=0;
  function resize(){
    const r=hero.getBoundingClientRect(); vw=r.width; vh=r.height;
    const dpr=Math.min(window.devicePixelRatio||1,2);
    cv.width=Math.round(vw*dpr); cv.height=Math.round(vh*dpr);
    cv.style.width=vw+'px'; cv.style.height=vh+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality='high';
  }

  function drawScene(time){
    if(!ready) return;
    const horizonY = vh*0.42;
    const seaTop   = vh*0.30;          // tiles map from here downward
    const lightX = vw*0.62, lightY = vh*0.44;

    ctx.clearRect(0,0,vw,vh);

    // --- sky ---
    const sky=ctx.createLinearGradient(0,0,0,horizonY);
    sky.addColorStop(0,'#c7beb0'); sky.addColorStop(0.55,'#ddd4c4'); sky.addColorStop(1,'#f3ecdd');
    ctx.fillStyle=sky; ctx.fillRect(0,0,vw,horizonY+2);
    // dawn bloom
    const bloom=ctx.createRadialGradient(lightX,lightY,0,lightX,lightY,Math.max(vw,vh)*0.7);
    bloom.addColorStop(0,'rgba(252,247,238,0.55)'); bloom.addColorStop(0.5,'rgba(250,243,231,0.18)'); bloom.addColorStop(1,'rgba(250,243,231,0)');
    ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.fillStyle=bloom; ctx.fillRect(0,0,vw,vh*0.7); ctx.restore();

    // --- distant ridges ---
    function drawRidge(pts,col){
      const per=12, sx=vw/per;
      ctx.beginPath(); ctx.moveTo(0,horizonY+2);
      for(const p of pts){ ctx.lineTo(p[0]*sx, horizonY - (p[1]-1.6)*26); }
      ctx.lineTo(vw,horizonY+2); ctx.closePath(); ctx.fillStyle=col; ctx.fill();
    }
    drawRidge(ridgeB,'rgba(201,192,176,0.55)');
    drawRidge(ridgeA,'rgba(190,180,163,0.6)');

    // --- cloud sea (two parallax layers) ---
    const regionH = vh - seaTop;
    for(const L of layers){
      const sW=L.cv.width, sH=L.cv.height;
      const destW=vw*L.zoom, destH=regionH;
      const top=seaTop + vh*(L.vy-0.30);
      const off=-(((reduce?0:time*0.001*L.speed*16)) % destW);
      for(let x=off-destW; x<vw+destW; x+=destW){
        ctx.drawImage(L.cv,0,0,sW,sH, x, top, destW, destH);
      }
    }

    // --- unify glow over the cloud tops near the light ---
    const glow=ctx.createRadialGradient(lightX,lightY,0,lightX,lightY,Math.max(vw,vh)*0.6);
    glow.addColorStop(0,'rgba(255,250,242,0.40)'); glow.addColorStop(0.6,'rgba(255,250,242,0.08)'); glow.addColorStop(1,'rgba(255,250,242,0)');
    ctx.save(); ctx.globalCompositeOperation='screen'; ctx.fillStyle=glow; ctx.fillRect(0,horizonY*0.6,vw,vh); ctx.restore();
  }

  let start=performance.now(), raf=0, visible=true;
  function loop(now){ if(visible){ drawScene(now-start); } raf=requestAnimationFrame(loop); }
  document.addEventListener('visibilitychange',()=>{visible=!document.hidden;});

  resize(); build(); requestAnimationFrame(loop);
  let rt; window.addEventListener('resize',()=>{clearTimeout(rt); rt=setTimeout(resize,120);});
})();
</script>
</body>
</html>
