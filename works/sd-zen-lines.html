<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Structure Designer - 禅 | 瞑想的な線画アニメーション</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #fdfcfa; /* わずかに暖かみのある白 */
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
        }

        .container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* SVGコンテナ */
        .logo-container {
            position: relative;
            width: 500px;
            height: 500px;
        }

        svg {
            width: 100%;
            height: 100%;
        }

        /* 各線のスタイル */
        path {
            fill: none !important;
            stroke: #2a2a2a !important; /* 墨のような色 */
            stroke-width: 5 !important; /* より繊細な線 */
            stroke-linecap: round;
            stroke-linejoin: round;
            opacity: 0;
        }

        /* 白い塗りつぶしの要素は除外 */
        .cls-1 {
            fill: #fff !important;
            stroke: none !important;
        }

        /* 中心の円 */
        circle {
            stroke: #2a2a2a !important; /* 墨のような色 */
            stroke-width: 5 !important; /* より繊細な線 */
            opacity: 0;
        }
        
        /* 白い円は除外 */
        circle.cls-1 {
            fill: #fff !important;
            stroke: none !important;
            opacity: 1 !important;
        }

        /* 描画アニメーション */
        .draw-animation {
            animation: drawPath var(--duration) var(--ease) forwards;
            animation-delay: var(--delay);
            /* わずかな揺らぎ */
            transform-origin: center;
            animation-timing-function: cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        @keyframes drawPath {
            0% {
                stroke-dashoffset: var(--length);
                opacity: 0;
            }
            5% {
                opacity: 0.2; /* よりゆっくりと現れる */
            }
            10% {
                opacity: 0.6;
            }
            90% {
                opacity: 0.8;
            }
            100% {
                stroke-dashoffset: 0;
                opacity: 0.7; /* 完成後も控えめな濃さ */
            }
        }

        /* フェードアニメーション（円用） */
        .fade-animation {
            animation: fadeIn var(--duration) ease-out forwards;
            animation-delay: var(--delay);
        }

        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: scale(0.9);
            }
            100% {
                opacity: 0.7; /* 控えめに */
                transform: scale(1);
            }
        }

        /* 消えるアニメーション */
        .fade-out {
            animation: fadeOut 8s ease-out forwards;
        }

        @keyframes fadeOut {
            0% {
                opacity: 0.8;
            }
            80% {
                opacity: 0.2;
            }
            100% {
                opacity: 0;
            }
        }

        /* 会社名 */
        .company-name {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 13px;
            letter-spacing: 10px;
            color: #6a6a6a; /* より柔らかい色 */
            opacity: 0;
            font-weight: 300;
            text-transform: uppercase;
        }

        .company-name.show {
            animation: fadeText 20s ease-out;
        }

        @keyframes fadeText {
            0%, 100% {
                opacity: 0;
            }
            20%, 90% {
                opacity: 0.2; /* より長く表示 */
            }
        }

        /* 呼吸ガイド */
        .breath-guide {
            position: absolute;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            color: #8a8a8a; /* より柔らかい色 */
            letter-spacing: 3px;
            opacity: 0;
            font-weight: 300;
        }

        .breath-guide.active {
            animation: breathGuide 20s ease-out;
        }

        @keyframes breathGuide {
            0%, 100% {
                opacity: 0;
            }
            10%, 80% {
                opacity: 0.3; /* より長く表示 */
            }
        }

        /* 背景の微細なパルス */
        .pulse-bg {
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle at center, 
                transparent 30%, 
                rgba(42,42,42,0.01) 50%, 
                transparent 70%);
            opacity: 0;
        }

        .pulse-bg.active {
            animation: subtlePulse 20s ease-out;
        }

        @keyframes subtlePulse {
            0%, 100% {
                transform: scale(0.9);
                opacity: 0;
            }
            50% {
                transform: scale(1.1);
                opacity: 0.15; /* より控えめに */
            }
        }

        /* コントロールヒント */
        .controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 11px;
            color: #b0b0b0;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .controls:hover {
            opacity: 0.6;
        }

        /* エラーメッセージ */
        .error-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #6a6a6a;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 背景パルス -->
        <div class="pulse-bg" id="pulseBg"></div>

        <div class="breath-guide" id="breathGuide">一筆一筆、心を込めて</div>

        <!-- ロゴコンテナ -->
        <div class="logo-container" id="logoContainer">
            <!-- SVGがここに読み込まれます -->
        </div>

        <!-- 会社名 -->
        <div class="company-name" id="companyName">structure designer</div>

        <!-- コントロール -->
        <div class="controls">クリックで一時停止 / スペースキーで再開 / 禅僧の筆のように</div>

        <!-- エラーメッセージ -->
        <div class="error-message" id="errorMessage">
            <p>SVGファイルが読み込めません</p>
            <small>ファイル名を確認してください</small>
        </div>
    </div>

,24.22-13.59,14.55-21.38,34-21.38,53.35,0,12.34,4.77,23.91,13.44,32.56,8.21,8.19,19.11,13.13,30.25,13.79"/></g><g id="circle_01"><path d="M1396.9,1319.34c-7.67,0-13.92-6.24-13.92-13.92s6.24-13.92,13.92-13.92,13.92,6.24,13.92,13.92-6.24,13.92-13.92,13.92ZM1396.9,1303.51c-1.06,0-1.92.86-1.92,1.92s.86,1.92,1.92,1.92,1.92-.86,1.92-1.92-.86-1.92-1.92-1.92Z"/></g></svg>`;
                
                document.getElementById('logoContainer').innerHTML = svgContent;
                
                // SVGが読み込まれたらアニメーション開始
                initAnimation();
            } catch (error) {
                console.error('SVG読み込みエラー:', error);
                document.getElementById('errorMessage').style.display = 'block';
            }
        }

        // アニメーションの初期化
        function initAnimation() {
            // SVG内のすべてのg要素内のpath要素を取得（線のみ）
            const linePaths = document.querySelectorAll('g[id^="line_"] path');
            // 円要素を取得（白い塗りつぶしの円は除外）
            const circles = document.querySelectorAll('g[id^="circle_"] path');
            const allElements = [...linePaths, ...circles];
            
            const breathGuide = document.getElementById('breathGuide');
            const companyName = document.getElementById('companyName');
            const pulseBg = document.getElementById('pulseBg');
            
            if (allElements.length === 0) {
                console.error('アニメーション要素が見つかりません');
                return;
            }

            console.log(`アニメーション要素数: ${allElements.length}`);

            // アニメーションパターン
            const patterns = [
                'random',        // ランダムに
                'sequential',    // 順番に
                'meditation',    // 瞑想的（大きな間を持って）
                'centerOut',     // 中心から外へ
                'outToCenter',   // 外から中心へ
                'spiral'         // 螺旋状に
            ];
            
            let currentPattern = 0;
            let animationTimeout;
            let isPaused = false;

            function animateElements() {
                if (isPaused) return;

                // 前のアニメーションをクリア
                allElements.forEach(element => {
                    element.classList.remove('draw-animation', 'fade-animation', 'fade-out');
                    element.style.opacity = 0;
                });

                // UI要素をリセット
                breathGuide.classList.remove('active');
                companyName.classList.remove('show');
                pulseBg.classList.remove('active');

                // パターンに応じて要素を並べ替え
                const pattern = patterns[currentPattern];
                let orderedElements = Array.from(allElements);
                
                // パターンに応じて呼吸ガイドのテキストを変更
                const breathTexts = {
                    'random': ['無作為の美', '偶然の妙', '自然の理'],
                    'sequential': ['順序の調和', '一歩一歩', '着実に'],
                    'meditation': ['静寂の中で', '無心', '只管打坐'],
                    'centerOut': ['内から外へ', '心を開いて', '広がる波紋'],
                    'outToCenter': ['外から内へ', '内省', '中心へ還る'],
                    'spiral': ['螺旋の流れ', '永遠の循環', '陰陽の調和']
                };
                const texts = breathTexts[pattern] || ['一筆一筆、心を込めて'];
                const selectedText = texts[Math.floor(Math.random() * texts.length)];
                breathGuide.textContent = selectedText;

                switch (pattern) {
                    case 'random':
                        orderedElements.sort(() => Math.random() - 0.5);
                        break;
                    case 'meditation':
                        // 瞑想的な順序（少ない要素をゆっくりと）
                        const meditationCount = Math.min(8, orderedElements.length); // 最大8本の線
                        const selectedElements = [];
                        const usedIndices = new Set();
                        
                        // 重複しないようにランダムに選択
                        while (selectedElements.length < meditationCount) {
                            const randomIndex = Math.floor(Math.random() * orderedElements.length);
                            if (!usedIndices.has(randomIndex)) {
                                selectedElements.push(orderedElements[randomIndex]);
                                usedIndices.add(randomIndex);
                            }
                        }
                        orderedElements = selectedElements;
                        break;
                    case 'centerOut':
                        // line番号で並べ替え（中心から外へ = 番号が小さい順）
                        orderedElements.sort((a, b) => {
                            const aNum = parseInt(a.parentElement.id.match(/line_(\d+)/)?.[1] || '99');
                            const bNum = parseInt(b.parentElement.id.match(/line_(\d+)/)?.[1] || '99');
                            return aNum - bNum;
                        });
                        break;
                    case 'outToCenter':
                        // 逆順（外から中心へ = 番号が大きい順）
                        orderedElements.sort((a, b) => {
                            const aNum = parseInt(a.parentElement.id.match(/line_(\d+)/)?.[1] || '0');
                            const bNum = parseInt(b.parentElement.id.match(/line_(\d+)/)?.[1] || '0');
                            return bNum - aNum;
                        });
                        break;
                    case 'spiral':
                        // 螺旋状に（一つおきに）
                        const even = orderedElements.filter((_, i) => i % 2 === 0);
                        const odd = orderedElements.filter((_, i) => i % 2 === 1);
                        orderedElements = [...even, ...odd.reverse()];
                        break;
                }

                // 各要素にアニメーションを適用
                orderedElements.forEach((element, index) => {
                    // ランダムな遅延を追加（禅僧が考えながら描くような間）
                    const randomDelay = Math.random() * 5; // 0〜5秒のランダムな間
                    let baseDelay = index * 3; // 基本の遅延（3秒間隔）
                    
                    // 瞑想パターンの場合はさらに間を長く
                    if (pattern === 'meditation') {
                        baseDelay = index * 8; // 8秒間隔
                    }
                    
                    // pathとcircleで処理を分ける
                    if (element.tagName === 'path') {
                        const length = element.getTotalLength();
                        
                        // 線の太さをランダムに（筆圧の表現）
                        const strokeVariation = 4 + Math.random() * 2; // 4-6の間
                        element.style.strokeWidth = strokeVariation;
                        
                        // CSS変数を設定（より遅く、瞑想的に）
                        element.style.setProperty('--length', length);
                        element.style.setProperty('--delay', `${baseDelay + randomDelay}s`);
                        element.style.setProperty('--duration', '8s'); // さらにゆっくりと描画
                        element.style.setProperty('--ease', 'cubic-bezier(0.15, 0, 0.1, 1)'); // より自然な筆の動き
                        
                        // stroke-dasharrayを設定
                        element.style.strokeDasharray = length;
                        element.style.strokeDashoffset = length;
                        
                        // アニメーションクラスを追加
                        element.classList.add('draw-animation');
                    } else if (element.tagName === 'circle') {
                        // 円の場合
                        const r = parseFloat(element.getAttribute('r') || 0);
                        const circumference = 2 * Math.PI * r;
                        
                        // 線の太さをランダムに
                        const strokeVariation = 4 + Math.random() * 2;
                        element.style.strokeWidth = strokeVariation;
                        
                        element.style.setProperty('--length', circumference);
                        element.style.setProperty('--delay', `${baseDelay + randomDelay}s`);
                        element.style.setProperty('--duration', '6s'); // 円もさらにゆっくり
                        
                        if (element.getAttribute('fill') !== 'none' && element.getAttribute('fill')) {
                            // 塗りつぶしの円
                            element.classList.add('fade-animation');
                        } else {
                            // 線の円
                            element.style.strokeDasharray = circumference;
                            element.style.strokeDashoffset = circumference;
                            element.classList.add('draw-animation');
                        }
                    }
                });

                // UI要素のアニメーション
                setTimeout(() => {
                    breathGuide.classList.add('active');
                    pulseBg.classList.add('active');
                }, 3000); // ゆっくり開始

                setTimeout(() => {
                    companyName.classList.add('show');
                }, orderedElements.length * 3000 + 8000); // より長い間隔

                // フェードアウト
                const totalDuration = orderedElements.length * 3000 + 25000; // 全体的にさらに長く
                animationTimeout = setTimeout(() => {
                    allElements.forEach(element => element.classList.add('fade-out'));
                    
                    // 次のパターンへ
                    setTimeout(() => {
                        currentPattern = (currentPattern + 1) % patterns.length;
                        animateElements();
                    }, 8000); // 間も長く
                }, totalDuration);
            }

            // イベントリスナー
            document.addEventListener('click', () => {
                isPaused = !isPaused;
                if (!isPaused) {
                    animateElements();
                } else {
                    clearTimeout(animationTimeout);
                }
            });

            document.addEventListener('keydown', (e) => {
                if (e.code === 'Space') {
                    e.preventDefault();
                    isPaused = false;
                    animateElements();
                }
            });

            // アニメーション開始
            setTimeout(animateElements, 3000); // 3秒の静寂の後に開始
        }

        // ページ読み込み時に実行
        window.addEventListener('DOMContentLoaded', () => {
            // SVGファイルを読み込む
            loadSVG();
        });
    </script>
